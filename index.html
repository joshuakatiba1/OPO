<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opondo's Family</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --green: #285943;
      --dark-green: #193d2d;
      --light-green: #dce8dc;
      --beige: #f3ead8;
      --cream: #fffaf0;
      --brown: #735c3d;
      --white: #ffffff;
      --text: #26352d;
      --muted: #718077;
      --border: #ddd2bd;
      --shadow: 0 5px 20px rgba(40, 89, 67, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: var(--beige);
      color: var(--text);
      min-height: 100vh;
    }

    button {
      border: none;
      cursor: pointer;
      font-family: inherit;
    }

    input,
    textarea,
    select {
      font-family: inherit;
    }

    /* LOGIN */

    #authPage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      background:
        linear-gradient(rgba(243, 234, 216, 0.88), rgba(243, 234, 216, 0.94)),
        radial-gradient(circle at top left, #b8d0bc, transparent 40%);
    }

    .auth-card {
      width: 100%;
      max-width: 430px;
      background: var(--cream);
      padding: 40px 30px;
      border-radius: 25px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      text-align: center;
    }

    .family-logo {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      background: var(--green);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      font-size: 30px;
      font-weight: bold;
    }

    .auth-card h1 {
      color: var(--green);
      margin-bottom: 8px;
      font-size: 30px;
    }

    .auth-card .subtitle {
      color: var(--brown);
      margin-bottom: 28px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      font-size: 14px;
      color: var(--green);
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: white;
      outline: none;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--green);
    }

    .primary-btn {
      width: 100%;
      padding: 14px;
      background: var(--green);
      color: white;
      border-radius: 12px;
      font-weight: bold;
      margin-top: 8px;
    }

    .primary-btn:hover {
      background: var(--dark-green);
    }

    .switch-auth {
      margin-top: 20px;
      color: var(--muted);
      font-size: 14px;
    }

    .switch-auth button {
      background: none;
      color: var(--green);
      font-weight: bold;
      margin-left: 5px;
    }

    .message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 10px;
      font-size: 14px;
      display: none;
    }

    .error {
      background: #f6dada;
      color: #8b2e2e;
