<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opondo's Family</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --green: #285943;
      --dark-green: #193d2d;
      --light-green: #dce8dc;
      --beige: #f3ead8;
      --cream: #fffaf0;
      --brown: #735c3d;
      --text: #26352d;
      --muted: #718077;
      --border: #ddd2bd;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--beige);
      color: var(--text);
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
    }

    /* LOGIN */

    #authPage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: var(--beige);
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      background: var(--cream);
      padding: 35px 25px;
      border-radius: 25px;
      border: 1px solid var(--border);
      box-shadow: 0 8px 30px rgba(40, 89, 67, 0.12);
      text-align: center;
    }

    .logo {
      width: 75px;
      height: 75px;
      margin: 0 auto 15px;
      border-radius: 50%;
      background: var(--green);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 27px;
      font-weight: bold;
    }

    h1 {
      color: var(--green);
      margin: 10px 0;
    }

    .subtitle {
      color: var(--brown);
      margin-bottom: 25px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 15px;
    }

    label {
      display: block;
      color: var(--green);
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 14px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: white;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--green);
    }

    .main-btn {
      width: 100%;
      padding: 14px;
      background: var(--green);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .main-btn:hover {
      background: var(--dark-green);
    }

    .switch {
      margin-top: 18px;
      color: var(--muted);
      font-size: 14px;
    }

    .switch button {
      background: none;
      color: var(--green);
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    #authMessage {
      margin-top: 15px;
      padding: 10px;
      border-radius: 10px;
      display: none;
      font-size: 14px;
    }

    .error {
      background: #f5d6d6;
      color: #8b2525;
    }

    .success {
      background: var(--light-green);
      color: var(--dark-green);
    }

    /* APP */

    #app {
      display: none;
    }

    .topbar {
      background: var(--green);
      color: white;
      padding: 12px 5%;
      min-height: 65px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--beige);
      color: var(--green);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .brand h2 {
      margin: 0;
      font-size: 20px;
    }

    .logout {
      background: transparent;
      border: 1px solid white;
      color: white;
      padding: 8px 14px;
      border-radius: 20px;
    }

    .layout {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 20px;
    }

    .sidebar {
      background: var(--cream);
      padding: 12px;
      border-radius: 18px;
      height: fit-content;
      border: 1px solid var(--border);
    }

    .nav {
      width: 100%;
      padding: 12px;
      margin-bottom: 5px;
      background: transparent;
      border: none;
      border-radius: 10px;
      text-align: left;
      color: var(--text);
      font-weight: bold;
      cursor: pointer;
    }

    .nav:hover,
    .nav.active {
      background: var(--light-green);
      color: var(--green);
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    .welcome {
      background: var(--green);
      color: white;
      padding: 25px;
      border-radius: 20px;
      margin-bottom: 18px;
    }

    .welcome h1 {
      color: white;
      margin-top: 0;
    }

    .card {
      background: var(--cream);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 5px 18px rgba(40,89,67,0.06);
    }

    .card h2 {
      color: var(--green);
      margin-top: 0;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .post-btn {
      margin-top: 10px;
      background: var(--green);
      color: white;
      border: none;
      padding: 11px 18px;
      border-radius: 10px;
      font-weight: bold;
    }

    .post {
      border-top: 1px solid var(--border);
      padding-top: 15px;
      margin-top: 15px;
    }

    .post-header {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--light-green);
      color: var(--green);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .post-name {
      color: var(--green);
      font-weight: bold;
    }

    .post-date {
      font-size: 12px;
      color: var(--muted);
    }

    .post-content {
      margin-top: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .members {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
    }

    .member {
      background: var(--cream);
      padding: 20px;
      border-radius: 18px;
      border: 1px solid var(--border);
      text-align: center;
    }

    .member-avatar {
      width: 65px;
      height: 65px;
      margin: auto;
      border-radius: 50%;
      background: var(--green);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
    }

    .member h3 {
      color: var(--green);
      margin-bottom: 5px;
    }

    .member p {
      color: var(--muted);
    }

    .chat-box {
      height: 400px;
      overflow-y: auto;
      background: white;
      padding: 15px;
      border-radius: 15px;
      border: 1px solid var(--border);
      margin-bottom: 10px;
    }

    .message {
      background: var(--light-green);
      padding: 10px;
      border-radius: 12px;
      margin-bottom: 10px;
    }

    .message strong {
      color: var(--green);
    }

    .message small {
      display: block;
      color: var(--muted);
      margin-top: 4px;
    }

    .chat-form {
      display: flex;
      gap: 8px;
    }

    .chat-form input {
      flex: 1;
    }

    .chat-form button {
      background: var(--green);
      color: white;
      border: none;
      padding: 0 18px;
      border-radius: 12px;
    }

    .event {
      background: var(--cream);
      border-left: 5px solid var(--green);
      padding: 15px;
      margin-bottom: 12px;
      border-radius: 12px;
    }

    .event h3 {
      color: var(--green);
    }

    .tree {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-top: 25px;
    }

    .tree-person {
      background: var(--cream);
      padding
