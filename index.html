<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opondo's Family</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body style="
  background:#f8f1df;
  font-family:Arial;
  text-align:center;
  padding:40px;
">

  <h1 style="color:#5b351f;">
    🌿 Opondo's Family 🌿
  </h1>

  <div style="
    max-width:400px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:15px;
  ">

    <h2 style="color:#28704b;">
      Welcome Back
    </h2>

    <input
      id="email"
      type="email"
      placeholder="Email"
      style="
        width:100%;
        padding:12px;
        margin:8px 0;
        box-sizing:border-box;
      "
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
      style="
        width:100%;
        padding:12px;
        margin:8px 0;
        box-sizing:border-box;
      "
    >

    <button
      id="loginButton"
      style="
        width:100%;
        padding:12px;
        background:#28704b;
        color:white;
        border:none;
        border-radius:8px;
        font-weight:bold;
      "
    >
      Login
    </button>

    <p id="message"></p>

  </div>


<script>

const SUPABASE_URL =
  "https://udbkgjgomhxclgasbfmz.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_WOP5H3ij2JBj2s6_9tyxiA_KMoqiwCV";

const client =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


document
  .getElementById("loginButton")
  .addEventListener("click", async function(){

    const email =
      document
        .getElementById("email")
        .value
        .trim();

    const password =
      document
        .getElementById("password")
        .value;

    const message =
      document
        .getElementById("message");


    if(!email || !password){

      message.innerText =
        "Please enter your email and password.";

      return;
    }


    message.innerText =
      "Logging in...";


    const {data,error} =
      await client.auth.signInWithPassword({

        email: email,

        password: password

      });


    if(error){

      message.innerText =
        "❌ " + error.message;

      return;
    }


    message.innerText =
      "✅ LOGIN SUCCESSFUL!";


    console.log(data);

  });

</script>

</body>
</html>
