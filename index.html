<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Opondo's Family</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3ead8;
    color: #263b2b;
}

.container {
    min-height: 100vh;
    padding: 20px 15px;
}

.card {
    background: white;
    width: 100%;
    max-width: 650px;
    margin: 20px auto;
    padding: 25px;
    border-radius: 18px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.12);
}

h1 {
    color: #315c3b;
    text-align: center;
}

h2 {
    color: #315c3b;
}

input,
textarea {
    width: 100%;
    padding: 13px;
    margin: 8px 0;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
}

button {
    padding: 11px 16px;
    margin-top: 8px;
    border: none;
    border-radius: 8px;
    background: #315c3b;
    color: white;
    font-size: 15px;
    cursor: pointer;
}

button:hover {
    background: #25482e;
}

.full-button {
    width: 100%;
}

.logout {
    background: #9b3d3d;
}

.secondary {
    background: #8a7653;
}

.switch {
    margin-top: 20px;
    text-align: center;
    color: #315c3b;
    cursor: pointer;
}

#registerForm,
#familyPage {
    display: none;
}

.message {
    text-align: center;
    margin-top: 12px;
}

.upload-box {
    background: #f7f1e5;
    padding: 20px;
    border-radius: 12px;
    margin-top: 20px;
}

.file-input {
    background: white;
}

.feed-post {
    background: #fff;
    border: 1px solid #e4dfd4;
    border-radius: 14px;
    padding: 18px;
    margin-top: 18px;
}

.post-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.post-author {
    font-weight: bold;
    color: #315c3b;
}

.post-date {
    font-size: 12px;
    color: #888;
}

.post-content {
    margin: 15px 0;
    white-space: pre-wrap;
}

.post-media {
    width: 100%;
    max-height: 400px;
    object-fit: contain;
    border-radius: 10px;
    margin-top: 10px;
}

.post-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
}

.post-actions button {
    flex: 1;
}

.like-button {
    background: #8a7653;
}

.comment-button {
    background: #315c3b;
}

.delete-button {
    background: #9b3d3d;
}

.comments {
    margin-top: 15px;
    border-top: 1px solid #ddd;
    padding-top: 12px;
}

.comment {
    background: #f7f1e5;
    padding: 9px;
    border-radius: 8px;
    margin-top: 8px;
}

.comment-author {
    font-weight: bold;
    color: #315c3b;
}

.document {
    padding: 12px;
    background: #f7f1e5;
    border-radius: 8px;
    margin-top: 10px;
}

.document a {
    color: #315c3b;
    font-weight: bold;
}

.small {
    font-size: 12px;
    color: #777;
}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->

<div class="card" id="loginForm">

<h1>Opondo's Family 🌿</h1>

<p style="text-align:center;color:#777;">
Our family. Our memories. Our home.
</p>

<h2>Welcome Back</h2>

<input
type="email"
id="loginEmail"
placeholder="Email address"
>

<input
type="password"
id="loginPassword"
placeholder="Password"
>

<button class="full-button" onclick="login()">
Login
</button>

<p class="switch" onclick="showRegister()">
Don't have an account? Create one
</p>

<p id="loginMessage" class="message"></p>

</div>


<!-- REGISTER -->

<div class="card" id="registerForm">

<h1>Opondo's Family 🌿</h1>

<h2>Create Family Account</h2>

<input
type="text"
id="registerName"
placeholder="Full name"
>

<input
type="email"
id="registerEmail"
placeholder="Email address"
>

<input
type="password"
id="registerPassword"
placeholder="Password"
>

<button class="full-button" onclick="register()">
Create Account
</button>

<p class="switch" onclick="showLogin()">
Already have an account? Login
</p>

<p id="registerMessage" class="message"></p>

</div>


<!-- FAMILY PAGE -->

<div id="familyPage">

<div class="card">

<h1>Opondo's Family 🌿</h1>

<p id="welcomeText"></p>

<button class="logout full-button" onclick="logout()">
Logout
</button>

</div>


<!-- CREATE POST -->

<div class="card">

<h2>📤 Share With The Family</h2>

<textarea
id="postContent"
rows="4"
placeholder="What's happening in the family?"
></textarea>

<input
type="file"
id="postFile"
accept="image/,video/,.pdf,.doc,.docx"
>

<button
class="full-button"
onclick="createPost()"
>
Share With Family
</button>

<p id="postMessage" class="message"></p>

</div>


<!-- FAMILY FEED -->

<div class="card">

<h2>👨‍👩‍👧‍👦 Family Feed</h2>

<div id="feed">
<p style="text-align:center;">
Loading family posts...
</p>
</div>

</div>


<!-- FAMILY DOCUMENTS -->

<div class="card">

<h2>📄 Family Documents</h2>

<div id="documents"></div>

</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://udbkgjgomhxclgasbfmz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_WOP5H3ij2JBj2s6_9tyxiA_KMoqiwCV";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* SHOW LOGIN */

function showLogin() {

document.getElementById("loginForm").style.display =
"block";

document.getElementById("registerForm").style.display =
"none";

document.getElementById("familyPage").style.display =
"none";

}


/* SHOW REGISTER */

function showRegister() {

document.getElementById("loginForm").style.display =
"none";

document.getElementById("registerForm").style.display =
"block";

document.getElementById("familyPage").style.display =
"none";

}


/* SHOW FAMILY PAGE */

function showFamily() {

document.getElementById("loginForm").style.display =
"none";

document.getElementById("registerForm").style.display =
"none";

document.getElementById("familyPage").style.display =
"block";

}


/* REGISTER */

async function register() {

const name =
document.getElementById("registerName").value.trim();

const email =
document.getElementById("registerEmail").value.trim();

const password =
document.getElementById("registerPassword").value;

if (!name || !email || !password) {

document.getElementById("registerMessage").textContent =
"Please fill in all fields.";

return;

}

const { error } =
await supabaseClient.auth.signUp({

email: email,

password: password,

options: {

data: {
full_name: name
}

}

});

if (error) {

document.getElementById("registerMessage").textContent =
error.message;

return;

}

document.getElementById("registerMessage").style.color =
"green";

document.getElementById("registerMessage").textContent =
"Account created. Check your email to confirm your account.";

}


/* LOGIN */

async function login() {

const email =
document.getElementById("loginEmail").value.trim();

const password =
document.getElementById("loginPassword").value;

const { data, error } =
await supabaseClient.auth.signInWithPassword({

email: email,

password: password

});

if (error) {

document.getElementById("loginMessage").textContent =
error.message;

return;

}

showFamily();

document.getElementById("welcomeText").textContent =
"Welcome to our family space.";

loadFeed();

loadDocuments();

}


/* LOGOUT */

async function logout() {

await supabaseClient.auth.signOut();

showLogin();

}


/* CREATE POST */

async function createPost() {

const content =
document.getElementById("postContent").value.trim();

const file =
document.getElementById("postFile").files[0];

const message =
document.getElementById("postMessage");

const {
data: { user }
} = await supabaseClient.auth.getUser();

if (!user) {

message.textContent =
"Please log in first.";

return;

}

if (!content && !file) {

message.textContent =
"Write something or attach a file.";

return;

}

message.textContent =
"Sharing with the family...";

let filePath = null;

let fileType = null;

let fileName = null;


/* UPLOAD ATTACHMENT */

if (file) {

fileName =
Date.now() + "_" +
file.name.replace(/\s+/g, "_");

filePath =
user.id + "/" + fileName;

fileType =
file.type;

const { error: uploadError } =
await supabaseClient.storage
.from("family-media")
.upload(filePath, file);

if (uploadError) {

message.textContent =
uploadError.message;

return;

}

}


/* CREATE POST */

const { error } =
await supabaseClient
.from("posts")
.insert({

user_id: user.id,

content: content || null,

image_url: filePath,

file_type: fileType,

file_name: fileName

});


if (error) {

message.textContent =
error.message;

return;

}

message.style.color =
"green";

message.textContent =
"Shared with the family! ❤️";

document.getElementById("postContent").value =
"";

document.getElementById("postFile").value =
"";

loadFeed();

}


/* LOAD FAMILY FEED */

async function loadFeed() {

const feed =
document.getElementById("feed");

feed.innerHTML =
"<p>Loading...</p>";

const { data: posts, error } =
await supabaseClient
.from("posts")
.select("*")
.order("created_at", {
ascending: false
});

if (error) {

feed.innerHTML =
"<p>Unable to load posts.</p>";

console.log(error);

return;

}

if (!posts || posts.length === 0) {

feed.innerHTML =
"<p style='text-align:center;'>No family posts yet. Be the first to share something! ❤️</p>";

return;

}

feed.innerHTML = "";

for (const post of posts) {

await displayPost(post);

}

}


/* DISPLAY POST */

async function displayPost(post) {

const feed =
document.getElementById("feed");

const { data: profile } =
await supabaseClient
.from("profiles")
.select("full_name")
.eq("id", post.user_id)
.single();

const name =
profile?.full_name ||
"Family Member";

const date =
new Date(post.created_at)
.toLocaleString();

const postDiv =
document.createElement("div");

postDiv.className =
"feed-post";

postDiv.id =
"post-" + post.id;

postDiv.innerHTML = `

<div class="post-header">

<div class="post-author">
👤 ${escapeHTML(name)}
</div>

<div class="post-date">
${date}
</div>

</div>

<div class="post-content">
${escapeHTML(post.content || "")}
</div>

<div class="attachment"></div>

<div class="post-actions">

<button
class="like-button"
onclick="likePost(${post.id})"
>
❤️ Like
</button>

<button
class="comment-button"
onclick="toggleComments(${post.id})"
>
💬 Comments
</button>

</div>

<div
class="comments"
id="comments-${post.id}"
style="display:none;"
>
</div>

`;

feed.appendChild(postDiv);


/* ATTACHMENT */

if (post.image_url) {

const attachment =
postDiv.querySelector(".attachment");

const { data } =
await supabaseClient.storage
.from("family-media")
.createSignedUrl(
post.image_url,
3600
);

if (data?.signedUrl) {

if (
post.file_type &&
post.file_type.startsWith("image/")
) {

attachment.innerHTML = `
<img
class="post-media"
src="${data.signedUrl}"
>
`;

}

else if (
post.file_type &&
post.file_type.startsWith("video/")
) {

attachment.innerHTML = `
<video
class="post-media"
controls
src="${data.signedUrl}"
>
</video>
`;

}

else {

attachment.innerHTML = `

<div class="document">

📄

<a
href="${data.signedUrl}"
target="_blank"
>
${escapeHTML(post.file_name || "Open document")}
</a>

</div>

`;

}

}

}

}


/* LIKE POST */

async function likePost(postId) {

const {
data: { user }
} = await supabaseClient.auth.getUser();

if (!user) return;

const { data: existing } =
await supabaseClient
.from("post_likes")
.select("id")
.eq("post_id", postId)
.eq("user_id", user.id)
.maybeSingle();

if (existing) {

await supabaseClient
.from("post_likes")
.delete()
.eq("id", existing.id);

} else {

await supabaseClient
.from("post_likes")
.insert({

post_id: postId,

user_id: user.id

});

}

}


/* COMMENTS */

async function toggleComments(postId) {

const box =
document.getElementById(
"comments-" + postId
);

if (box.style.display === "none") {

box.style.display =
"block";

await loadComments(postId);

} else {

box.style.display =
"none";

}

}


/* LOAD COMMENTS */

async function loadComments(postId) {

const box =
document.getElementById(
"comments-" + postId
);

const { data: comments } =
await supabaseClient
.from("comments")
.select("*")
.eq("post_id", postId)
.order("created_at", {
ascending: true
});

box.innerHTML = "";

if (comments) {

for (const comment of comments) {

const { data: profile } =
await supabaseClient
.from("profiles")
.select("full_name")
.eq("id", comment.user_id)
.single();

const div =
document.createElement("div");

div.className =
"comment";

div.innerHTML = `

<span class="comment-author">
${escapeHTML(profile?.full_name || "Family Member")}
</span>

<br>

${escapeHTML(comment.content)}

`;

box.appendChild(div);

}

}

const input =
document.createElement("input");

input.placeholder =
"Write a comment...";

const button =
document.createElement("button");

button.textContent =
"Comment";

button.onclick = async function() {

await addComment(
postId,
input.value
);

};

box.appendChild(input);

box.appendChild(button);

}


/* ADD COMMENT */

async function addComment(
postId,
content
) {

if (!content.trim()) return;

const {
data: { user }
} = await supabaseClient.auth.getUser();

if (!user) return;

const { error } =
await supabaseClient
.from("comments")
.insert({

post_id: postId,

user_id: user.id,

content: content.trim()

});

if (!error) {

loadComments(postId);

}

}


/* LOAD DOCUMENTS */

async function loadDocuments() {

const container =
document.getElementById("documents");

container.innerHTML = "";

const { data: posts } =
await supabaseClient
.from("posts")
.select("*")
.not("image_url", "is", null)
.order("created_at", {
ascending: false
});

if (!posts) return;

for (const post of posts) {

if (
post.file_type &&
(
post.file_type.includes("pdf") ||
post.file_type.includes("word") ||
post.file_name?.endsWith(".doc") ||
post.file_name?.endsWith(".docx")
)
) {

const { data } =
await supabaseClient.storage
.from("family-media")
.createSignedUrl(
post.image_url,
3600
);

if (data?.signedUrl) {

const div =
document.createElement("div");

div.className =
"document";

div.innerHTML = `

📄

<a
href="${data.signedUrl}"
target="_blank"
>
${escapeHTML(post.file_name || "Document")}
</a>

`;

container.appendChild(div);

}

}

}

}


/* ESCAPE HTML */

function escapeHTML(text) {

const div =
document.createElement("div");

div.textContent =
text;

return div.innerHTML;

}


/* CHECK LOGIN */

async function checkUser() {

const {
data: { user }
} = await supabaseClient.auth.getUser();

if (user) {

showFamily();

loadFeed();

loadDocuments();

}

}


/* START */

checkUser();

</script>

</body>
</html>
