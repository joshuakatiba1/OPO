<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opondo's Family</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:
    radial-gradient(circle at 10px 10px, rgba(52,92,70,.12) 2px, transparent 2.5px),
    #f8f1df;
  background-size:28px 28px;
  color:#3e281c;
}

header{
  background:#5b351f;
  color:white;
  padding:18px;
  text-align:center;
  box-shadow:0 3px 10px rgba(0,0,0,.15);
}

header h1{
  margin:0;
  font-size:28px;
}

header p{
  margin:6px 0 0;
  color:#f8df76;
}

.container{
  max-width:850px;
  margin:auto;
  padding:20px;
}

.card{
  background:#fffdf6;
  border-radius:18px;
  padding:18px;
  margin-bottom:20px;
  box-shadow:0 5px 18px rgba(91,53,31,.12);
  border:1px solid rgba(91,53,31,.08);
}

h2,h3{
  color:#24563d;
}

input,
textarea,
button,
select{
  width:100%;
  padding:12px;
  margin-top:8px;
  margin-bottom:10px;
  border-radius:10px;
  border:1px solid #cdbda7;
  font-size:15px;
}

textarea{
  min-height:90px;
  resize:vertical;
}

button{
  background:#28704b;
  color:white;
  border:none;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

button.brown{
  background:#5b351f;
}

button.yellow{
  background:#d4a928;
  color:#3e281c;
}

button.danger{
  background:#a33a32;
}

.hidden{
  display:none !important;
}

/* PROFILE */

.profile-box{
  display:flex;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
}

.avatar{
  width:65px;
  height:65px;
  border-radius:50%;
  object-fit:cover;
  background:#28704b;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  font-weight:bold;
  overflow:hidden;
  border:3px solid #d4a928;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-info{
  flex:1;
}

.profile-info h3{
  margin:0;
}

.profile-info p{
  margin:5px 0;
  color:#765c49;
}

/* STATUS */

.status-section{
  overflow:hidden;
}

.status-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.status-header h2{
  margin:0;
}

.status-row{
  display:flex;
  gap:14px;
  overflow-x:auto;
  padding:12px 3px 8px;
  scrollbar-width:none;
}

.status-row::-webkit-scrollbar{
  display:none;
}

.status-item{
  min-width:75px;
  text-align:center;
  cursor:pointer;
}

.status-circle{
  width:65px;
  height:65px;
  border-radius:50%;
  padding:3px;
  background:linear-gradient(135deg,#28704b,#d4a928,#5b351f);
  margin:auto;
}

.status-inner{
  width:100%;
  height:100%;
  border-radius:50%;
  background:#fffdf6;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

.status-inner img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.status-name{
  font-size:12px;
  margin-top:5px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.add-status{
  background:#e9dfc9;
}

.plus{
  font-size:28px;
  color:#28704b;
}

/* STATUS VIEWER */

.status-viewer{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.92);
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.status-content{
  max-width:650px;
  width:100%;
  max-height:90vh;
  background:#fffdf6;
  border-radius:18px;
  overflow:hidden;
  position:relative;
}

.status-content img,
.status-content video{
  width:100%;
  max-height:70vh;
  object-fit:contain;
  background:#111;
}

.status-text{
  padding:30px;
  font-size:24px;
  text-align:center;
  color:#3e281c;
}

.status-close{
  position:absolute;
  right:12px;
  top:12px;
  width:42px;
  height:42px;
  border-radius:50%;
  background:rgba(0,0,0,.65);
  color:white;
  font-size:22px;
  z-index:5;
  padding:0;
}

.status-user{
  padding:12px 16px;
  font-weight:bold;
  color:#24563d;
}

/* POSTS */

.post{
  border-top:1px solid #e5d8c4;
  padding-top:18px;
  margin-top:18px;
}

.post-header{
  display:flex;
  align-items:center;
  gap:10px;
}

.post-header .avatar{
  width:45px;
  height:45px;
  font-size:18px;
}

.post-author{
  font-weight:bold;
  color:#24563d;
}

.post-date{
  font-size:12px;
  color:#8a7867;
}

.post-content{
  margin:15px 0;
  line-height:1.5;
}

.post-media{
  width:100%;
  max-height:550px;
  object-fit:contain;
  border-radius:14px;
  background:#eee5d5;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.actions button{
  width:auto;
  padding:9px 15px;
  margin:0;
}

.comment-box{
  margin-top:12px;
}

.comment{
  background:#f1eadc;
  padding:9px;
  border-radius:10px;
  margin-top:7px;
  font-size:14px;
}

/* FLOWERS */

.flower{
  position:fixed;
  font-size:25px;
  opacity:.5;
  pointer-events:none;
}

.flower.one{
  top:100px;
  left:10px;
}

.flower.two{
  bottom:80px;
  right:15px;
}

.logout{
  max-width:150px;
  margin:10px auto 0;
}

/* MOBILE */

@media(max-width:600px){

  .container{
    padding:12px;
  }

  header h1{
    font-size:23px;
  }

  .card{
    padding:14px;
  }

  .actions{
    flex-wrap:wrap;
  }

  .actions button{
    flex:1;
  }

  .status-item{
    min-width:70px;
  }
}
</style>
</head>

<body>

<div class="flower one">🌸</div>
<div class="flower two">🌼</div>

<header>
  <h1>🌿 Opondo's Family 🌿</h1>
  <p>Our private family space ❤️</p>
</header>

<div class="container">

<!-- LOGIN -->

<div id="loginSection" class="card">

  <h2>Welcome Back 👋</h2>

  <input
    type="email"
    id="email"
    placeholder="Email"
  >

  <input
    type="password"
    id="password"
    placeholder="Password"
  >

  <button onclick="login()">Login</button>

  <p id="loginMessage"></p>

</div>


<!-- FAMILY APP -->

<div id="appSection" class="hidden">

  <!-- PROFILE -->

  <div class="card">

    <div class="profile-box">

      <div id="myAvatar" class="avatar">
        ?
      </div>

      <div class="profile-info">

        <h3 id="myName">
          Family Member
        </h3>

        <p>
          Your family profile
        </p>

      </div>

    </div>

    <input
      type="file"
      id="profilePhoto"
      accept="image/*"
    >

    <button onclick="uploadProfilePhoto()">
      📸 Change Profile Photo
    </button>

  </div>


  <!-- STATUS -->

  <div class="card status-section">

    <div class="status-header">

      <h2>Statuses 🌿</h2>

      <button
        class="yellow"
        style="width:auto;padding:8px 13px;"
        onclick="openStatusForm()"
      >
        + Add
      </button>

    </div>

    <div id="statusRow" class="status-row">

      <div
        class="status-item"
        onclick="openStatusForm()"
      >

        <div class="status-circle add-status">

          <div class="status-inner">

            <span class="plus">+</span>

          </div>

        </div>

        <div class="status-name">
          Your status
        </div>

      </div>

    </div>

  </div>


  <!-- STATUS CREATOR -->

  <div
    id="statusForm"
    class="card hidden"
  >

    <h2>Create Status 🌸</h2>

    <textarea
      id="statusText"
      placeholder="What's happening with the family?"
    ></textarea>

    <input
      type="file"
      id="statusFile"
      accept="image/,video/"
    >

    <button onclick="createStatus()">
      Share Status
    </button>

    <button
      class="brown"
      onclick="closeStatusForm()"
    >
      Cancel
    </button>

    <p id="statusMessage"></p>

  </div>


  <!-- CREATE POST -->

  <div class="card">

    <h2>Share With The Family 💚</h2>

    <textarea
      id="postText"
      placeholder="What's on your mind?"
    ></textarea>

    <input
      type="file"
      id="postFile"
      accept="image/,video/,.pdf,.doc,.docx"
    >

    <button onclick="createPost()">
      📤 Share
    </button>

    <p id="postMessage"></p>

  </div>


  <!-- FEED -->

  <div class="card">

    <h2>Family Feed 🌿</h2>

    <div id="feed">
      Loading family posts...
    </div>

  </div>


  <button
    class="brown logout"
    onclick="logout()"
  >
    Logout
  </button>

</div>

</div>


<!-- STATUS VIEWER -->

<div
  id="statusViewer"
  class="status-viewer hidden"
>

  <div class="status-content">

    <button
      class="status-close"
      onclick="closeStatusViewer()"
    >
      ×
    </button>

    <div id="statusViewerContent"></div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://udbkgjgomhxclgasbfmz.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_WOP5H3ij2JBj2s6_9tyxiA_KMoqiwCV";

const BUCKET =
  "Family Media";

const client =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let currentUser = null;


/* =========================
   LOGIN
========================= */

async function login(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");

  if(!email || !password){

    message.innerText =
      "Please enter your email and password.";

    return;
  }

  message.innerText =
    "Logging in...";

  const {data,error} =
    await client.auth.signInWithPassword({
      email,
      password
    });

  if(error){

    message.innerText =
      "❌ " + error.message;

    return;
  }

  currentUser =
    data.user;

  document
    .getElementById("loginSection")
    .classList.add("hidden");

  document
    .getElementById("appSection")
    .classList.remove("hidden");

  await loadMyProfile();

  await loadStatuses();

  await loadFeed();
}


/* =========================
   LOGOUT
========================= */

async function logout(){

  await client.auth.signOut();

  location.reload();
}


/* =========================
   PROFILE
========================= */

async function loadMyProfile(){

  const {data,error} =
    await client
      .from("profiles")
      .select("*")
      .eq("id",currentUser.id)
      .single();

  if(error){

    document.getElementById("myName")
      .innerText = "Family Member";

    return;
  }

  document.getElementById("myName")
    .innerText =
      data.full_name || "Family Member";

  const avatar =
    document.getElementById("myAvatar");

  if(data.avatar_url){

    const {data:urlData} =
      await client
        .storage
        .from(BUCKET)
        .createSignedUrl(
          data.avatar_url,
          3600
        );

    if(urlData?.signedUrl){

      avatar.innerHTML =
        <img src="${urlData.signedUrl}">;

      return;
    }
  }

  avatar.innerText =
    (data.full_name || "F")
      .charAt(0)
      .toUpperCase();
}


/* =========================
   PROFILE PHOTO
========================= */

async function uploadProfilePhoto(){

  const input =
    document.getElementById("profilePhoto");

  const file =
    input.files[0];

  if(!file){

    alert("Please choose a photo first.");

    return;
  }

  if(!currentUser){

    alert("Please login first.");

    return;
  }

  const extension =
    file.name.split(".").pop();

  const filePath =
    profiles/${currentUser.id}/avatar_${Date.now()}.${extension};

  const {error:uploadError} =
    await client
      .storage
      .from(BUCKET)
      .upload(
        filePath,
        file,
        {
          upsert:true
        }
      );

  if(uploadError){

    alert(
      "Profile upload failed: " +
      uploadError.message
    );

    return;
  }

  const {error:updateError} =
    await client
      .from("profiles")
      .update({
        avatar_url:filePath
      })
      .eq("id",currentUser.id);

  if(updateError){

    alert(
      "Profile update failed: " +
      updateError.message
    );

    return;
  }

  alert("✅ Profile photo updated!");

  input.value = "";

  await loadMyProfile();

  await loadStatuses();

  await loadFeed();
}


/* =========================
   STATUS FORM
========================= */

function openStatusForm(){

  document
    .getElementById("statusForm")
    .classList.remove("hidden");

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


function closeStatusForm(){

  document
    .getElementById("statusForm")
    .classList.add("hidden");

}


/* =========================
   CREATE STATUS
========================= */

async function createStatus(){

  const text =
    document
      .getElementById("statusText")
      .value
      .trim();

  const input =
    document.getElementById("statusFile");

  const file =
    input.files[0];

  const message =
    document.getElementById("statusMessage");

  if(!text && !file){

    message.innerText =
      "Write something or choose a photo/video.";

    return;
  }

  message.innerText =
    "Sharing status...";

  let mediaUrl = null;
  let mediaType = null;

  /* UPLOAD MEDIA */

  if(file){

    const extension =
      file.name.split(".").pop();

    const filePath =
      statuses/${currentUser.id}/${Date.now()}.${extension};

    const {error:uploadError} =
      await client
        .storage
        .from(BUCKET)
        .upload(
          filePath,
          file
        );

    if(uploadError){

      message.innerText =
        "❌ " + uploadError.message;

      return;
    }

    mediaUrl =
      filePath;

    if(file.type.startsWith("video/")){

      mediaType = "video";

    }else{

      mediaType = "image";
    }
  }


  /* INSERT STATUS */

  const {error} =
    await client
      .from("statuses")
      .insert({

        user_id:currentUser.id,

        content:text || null,

        media_url:mediaUrl,

        media_type:mediaType

      });


  if(error){

    message.innerText =
      "❌ " + error.message;

    return;
  }


  message.innerText =
    "✅ Status shared!";

  document
    .getElementById("statusText")
    .value = "";

  input.value = "";

  setTimeout(() => {

    closeStatusForm();

  },700);

  await loadStatuses();
}


/* =========================
   LOAD STATUSES
========================= */

async function loadStatuses(){

  const statusRow =
    document.getElementById("statusRow");

  statusRow.innerHTML = `

    <div
      class="status-item"
      onclick="openStatusForm()"
    >

      <div class="status-circle add-status">

        <div class="status-inner">

          <span class="plus">+</span>

        </div>

      </div>

      <div class="status-name">
        Your status
      </div>

    </div>

  `;


  const {data:statuses,error} =
    await client
      .from("statuses")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(error){

    console.log(error);

    return;
  }


  /* Only show statuses from last 24 hours */

  const now =
    new Date();

  const activeStatuses =
    statuses.filter(status => {

      const created =
        new Date(status.created_at);

      const hours =
        (now-created)/(1000*60*60);

      return hours < 24;

    });


  /* Group statuses by user */

  const grouped = {};

  activeStatuses.forEach(status => {

    if(!grouped[status.user_id]){

      grouped[status.user_id] = [];

    }

    grouped[status.user_id].push(status);

  });


  const userIds =
    Object.keys(grouped);

  if(userIds.length === 0){

    return;
  }


  const {data:profiles} =
    await client
      .from("profiles")
      .select("id,full_name,avatar_url")
      .in("id",userIds);


  for(const profile of profiles || []){

    const userStatuses =
      grouped[profile.id];

    const firstStatus =
      userStatuses[0];


    let avatarHtml =
      `<span style="font-size:25px">
        ${(profile.full_name || "F")
          .charAt(0)
          .toUpperCase()}
      </span>`;


    if(profile.avatar_url){

      const {data:urlData} =
        await client
          .storage
          .from(BUCKET)
          .createSignedUrl(
            profile.avatar_url,
            3600
          );

      if(urlData?.signedUrl){

        avatarHtml =
          <img src="${urlData.signedUrl}">;
      }
    }


    const item =
      document.createElement("div");

    item.className =
      "status-item";


    item.onclick =
      () => viewStatusGroup(
        userStatuses,
        profile.full_name
      );


    item.innerHTML = `

      <div class="status-circle">

        <div class="status-inner">

          ${avatarHtml}

        </div>

      </div>

      <div class="status-name">

        ${escapeHtml(
          profile.full_name || "Family Member"
        )}

      </div>

    `;


    statusRow.appendChild(item);

  }
}


/* =========================
   VIEW STATUS GROUP
========================= */

async function viewStatusGroup(
  statuses,
  name
){

  if(!statuses || statuses.length === 0){

    return;
  }

  const viewer =
    document.getElementById(
      "statusViewer"
    );

  const content =
    document.getElementById(
      "statusViewerContent"
    );


  let index = 0;


  async function showCurrent(){

    const status =
      statuses[index];

    let mediaHtml = "";


    if(status.media_url){

      const {data:urlData,error} =
        await client
          .storage
          .from(BUCKET)
          .createSignedUrl(
            status.media_url,
            3600
          );


      if(!error && urlData?.signedUrl){

        if(status.media_type === "video"){

          mediaHtml = `

            <video
              src="${urlData.signedUrl}"
              controls
              autoplay
            ></video>

          `;

        }else{

          mediaHtml = `

            <img
              src="${urlData.signedUrl}"
            >

          `;
        }
      }
    }


    const textHtml =
      status.content
        ? `<div class="status-text">
             ${escapeHtml(status.content)}
           </div>`
        : "";


    content.innerHTML = `

      <div class="status-user">

        ${escapeHtml(name)}

        <br>

        <small>
          ${formatDate(status.created_at)}
        </small>

      </div>

      ${mediaHtml}

      ${textHtml}

      <div style="
        display:flex;
        gap:8px;
        padding:12px;
      ">

        ${
          index > 0
          ?
          `<button
            onclick="previousStatus()"
          >
            ← Previous
          </button>`
          :
          ""
        }

        ${
          index < statuses.length - 1
          ?
          `<button
            onclick="nextStatus()"
          >
            Next →
          </button>`
          :
          ""
        }

        ${
          status.user_id === currentUser.id
          ?
          `<button
            class="danger"
            onclick="deleteStatus('${status.id}')"
          >
            Delete
          </button>`
          :
          ""
        }

      </div>

    `;

  }


  window.nextStatus =
    async function(){

      if(index < statuses.length - 1){

        index++;

        await showCurrent();

      }

    };


  window.previousStatus =
    async function(){

      if(index > 0){

        index--;

        await showCurrent();

      }

    };


  await showCurrent();

  viewer.classList.remove("hidden");
}


/* =========================
   CLOSE STATUS VIEWER
========================= */

function closeStatusViewer(){

  document
    .getElementById("statusViewer")
    .classList.add("hidden");

}


/* =========================
   DELETE STATUS
========================= */

async function deleteStatus(id){

  if(!confirm(
    "Delete this status?"
  )){

    return;
  }


  const {error} =
    await client
      .from("statuses")
      .delete()
      .eq("id",id)
      .eq("user_id",currentUser.id);


  if(error){

    alert(
      "Could not delete status: " +
      error.message
    );

    return;
  }


  closeStatusViewer();

  await loadStatuses();
}


/* =========================
   CREATE POST
========================= */

async function createPost(){

  const text =
    document
      .getElementById("postText")
      .value
      .trim();

  const input =
    document.getElementById("postFile");

  const file =
    input.files[0];

  const message =
    document.getElementById("postMessage");


  if(!text && !file){

    message.innerText =
      "Write something or choose a file.";

    return;
  }


  message.innerText =
    "Sharing...";


  let filePath = null;
  let fileType = null;
  let fileName = null;


  if(file){

    const extension =
      file.name.split(".").pop();

    fileName =
      file.name;

    fileType =
      file.type;


    const path =
      posts/${currentUser.id}/${Date.now()}_${file.name};


    const {error:uploadError} =
      await client
        .storage
        .from(BUCKET)
        .upload(
          path,
          file
        );


    if(uploadError){

      message.innerText =
        "❌ " + uploadError.message;

      return;
    }


    filePath = path;
  }


  const {error} =
    await client
      .from("posts")
      .insert({

        user_id:currentUser.id,

        content:text || null,

        image_url:filePath,

        file_type:fileType,

        file_name:fileName

      });


  if(error){

    message.innerText =
      "❌ " + error.message;

    return;
  }


  document
    .getElementById("postText")
    .value = "";

  input.value = "";

  message.innerText =
    "✅ Shared!";

  await loadFeed();
}


/* =========================
   LOAD FEED
========================= */

async function loadFeed(){

  const feed =
    document.getElementById("feed");

  feed.innerHTML =
    "Loading...";


  const {data:posts,error} =
    await client
      .from("posts")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(error){

    feed.innerHTML =
      "❌ " + error.message;

    return;
  }


  if(!posts || posts.length === 0){

    feed.innerHTML =
      "<p>No family posts yet. Be the first to share something! 🌸</p>";

    return;
  }


  const userIds =
    [...new Set(
      posts.map(p => p.user_id)
    )];


  const {data:profiles} =
    await client
      .from("profiles")
      .select(
        "id,full_name,avatar_url"
      )
      .in(
        "id",
        userIds
      );


  const profileMap = {};

  (profiles || []).forEach(p => {

    profileMap[p.id] = p;

  });


  const {data:likes} =
    await client
      .from("post_likes")
      .select("*");


  const {data:comments} =
    await client
      .from("comments")
      .select("*")
      .order(
        "created_at",
        {
          ascending:true
        }
      );


  feed.innerHTML = "";


  for(const post of posts){

    const profile =
      profileMap[post.user_id] || {};


    let avatarHtml =
      `<div class="avatar">
        ${(profile.full_name || "F")
          .charAt(0)
          .toUpperCase()}
       </div>`;


    if(profile.avatar_url){

      const {data:urlData} =
        await client
          .storage
          .from(BUCKET)
          .createSignedUrl(
            profile.avatar_url,
            3600
          );


      if(urlData?.signedUrl){

        avatarHtml =
          `<div class="avatar">
             <img
               src="${urlData.signedUrl}"
             >
           </div>`;
      }
    }


    const postDiv =
      document.createElement("div");

    postDiv.className =
      "post";


    let mediaHtml = "";


    if(post.image_url){

      const {data:urlData} =
        await client
          .storage
          .from(BUCKET)
          .createSignedUrl(
            post.image_url,
            3600
          );


      if(urlData?.signedUrl){

        if(
          post.file_type &&
          post.file_type.startsWith("video/")
        ){

          mediaHtml = `
            <video
              class="post-media"
              src="${urlData.signedUrl}"
              controls
            ></video>
          `;

        }else if(
          post.file_type &&
          post.file_type.includes("pdf")
        ){

          mediaHtml = `
            <a
              href="${urlData.signedUrl}"
              target="_blank"
            >
              📄 Open ${escapeHtml(
                post.file_name || "Document"
              )}
            </a>
          `;

        }else{

          mediaHtml = `
            <img
              class="post-media"
              src="${urlData.signedUrl}"
            >
          `;
        }
      }
    }


    const postLikes =
      (likes || [])
        .filter(
          l => l.post_id === post.id
        );


    const userLiked =
      postLikes.some(
        l => l.user_id === currentUser.id
      );


    const postComments =
      (comments || [])
        .filter(
          c => c.post_id === post.id
        );


    let commentsHtml = "";


    postComments.forEach(comment => {

      commentsHtml += `

        <div class="comment">

          ${escapeHtml(
            comment.content
          )}

        </div>

      `;

    });


    postDiv.innerHTML = `

      <div class="post-header">

        ${avatarHtml}

        <div>

          <div class="post-author">

            ${escapeHtml(
              profile.full_name ||
              "Family Member"
            )}

          </div>

          <div class="post-date">

            ${formatDate(
              post.created_at
            )}

          </div>

        </div>

      </div>


      ${
        post.content
        ?
        `<div class="post-content">
          ${escapeHtml(post.content)}
        </div>`
        :
        ""
      }


      ${mediaHtml}


      <div class="actions">

        <button
          onclick="toggleLike(${post.id})"
        >
          ${userLiked ? "❤️" : "🤍"}
          ${postLikes.length}
        </button>

        <button
          onclick="focusComment(${post.id})"
        >
          💬 ${postComments.length}
        </button>

        ${
          post.user_id === currentUser.id
          ?
          `<button
             class="danger"
             onclick="deletePost(${post.id})"
           >
             🗑️
           </button>`
          :
          ""
        }

      </div>


      <div class="comment-box">

        <input
          id="comment-${post.id}"
          placeholder="Write a comment..."
        >

        <button
          onclick="addComment(${post.id})"
        >
          Comment
        </button>

        ${commentsHtml}

      </div>

    `;


    feed.appendChild(postDiv);

  }
}


/* =========================
   LIKE
========================= */

async function toggleLike(postId){

  const {data:existing} =
    await client
      .from("post_likes")
      .select("*")
      .eq(
        "post_id",
        postId
      )
      .eq(
        "user_id",
        currentUser.id
      )
      .maybeSingle();


  if(existing){

    await client
      .from("post_likes")
      .delete()
      .eq(
        "id",
        existing.id
      );

  }else{

    await client
      .from("post_likes")
      .insert({

        post_id:postId,

        user_id:currentUser.id

      });

  }


  await loadFeed();
}


/* =========================
   COMMENTS
========================= */

async function addComment(postId){

  const input =
    document.getElementById(
      comment-${postId}
    );

  const content =
    input.value.trim();


  if(!content){

    return;
  }


  const {error} =
    await client
      .from("comments")
      .insert({

        post_id:postId,

        user_id:currentUser.id,

        content

      });


  if(error){

    alert(error.message);

    return;
  }


  input.value = "";

  await loadFeed();
}


function focusComment(postId){

  const input =
    document.getElementById(
      comment-${postId}
    );

  if(input){

    input.focus();

  }
}


/* =========================
   DELETE POST
========================= */

async function deletePost(postId){

  if(!confirm(
    "Delete this post?"
  )){

    return;
  }


  const {error} =
    await client
      .from("posts")
      .delete()
      .eq(
        "id",
        postId
      )
      .eq(
        "user_id",
        currentUser.id
      );


  if(error){

    alert(error.message);

    return;
  }


  await loadFeed();
}


/* =========================
   HELPERS
========================= */

function formatDate(date){

  return new Date(date)
    .toLocaleString();
}


function escapeHtml(value){

  if(value === null ||
     value === undefined){

    return "";
  }

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* =========================
   CHECK SESSION
========================= */

async function checkSession(){

  const {data} =
    await client.auth.getSession();


  if(data.session){

    currentUser =
      data.session.user;

    document
      .getElementById("loginSection")
      .classList.add("hidden");

    document
      .getElementById("appSection")
      .classList.remove("hidden");

    await loadMyProfile();

    await loadStatuses();

    await loadFeed();
  }
}


checkSession();

</script>
