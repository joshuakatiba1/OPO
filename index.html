<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Opondo's Family</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5efe3;
      color: #263d2b;
    }

    .container {
      width: 94%;
      max-width: 650px;
      margin: auto;
    }

    .login-box,
    .app {
      padding: 25px 0;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 18px;
      margin: 15px 0;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      color: #5b3a29;
      text-align: center;
    }

    h2 {
      color: #2f5d3a;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      margin: 7px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 11px 18px;
      cursor: pointer;
      font-weight: bold;
    }

    .green-btn {
      background: #2f5d3a;
      color: white;
    }

    .brown-btn {
      background: #5b3a29;
      color: white;
    }

    .logout-btn {
      background: #eee;
      color: #5b3a29;
    }

    .hidden {
      display: none;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .topbar h1 {
      margin: 0;
      text-align: left;
      font-size: 24px;
    }

    .profile-center {
      text-align: center;
    }

    #myProfilePhoto {
      width: 110px;
      height: 110px;
      margin: auto;
      border-radius: 50%;
      background: #2f5d3a;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      overflow: hidden;
    }

    #myProfilePhoto img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .post {
      border-top: 1px solid #eee;
      padding-top: 15px;
      margin-top: 15px;
    }

    .post-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .post-avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #2f5d3a;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      overflow: hidden;
      flex-shrink: 0;
    }

    .post-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .post-name {
      font-weight: bold;
      color: #5b3a29;
    }

    .post-content {
      white-space: pre-wrap;
      margin: 10px 0;
    }

    .post-image {
      width: 100%;
      max-height: 450px;
      object-fit: cover;
      border-radius: 12px;
      margin-top: 10px;
    }

    .post-video {
      width: 100%;
      border-radius: 12px;
      margin-top: 10px;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .actions button {
      background: #f1eee8;
      color: #5b3a29;
    }

    .comment-box {
      margin-top: 10px;
    }

    .comment {
      background: #f7f5f0;
      padding: 8px;
      border-radius: 8px;
      margin-top: 6px;
      font-size: 14px;
    }

    .error {
      color: #b00020;
    }

    .success {
      color: #26703b;
    }
  </style>
</head>

<body>


<!-- =========================
     LOGIN PAGE
========================= -->

<div id="loginPage" class="container login-box">

  <div class="card">

    <h1>🌿 Opondo's Family 🤎</h1>

    <p style="text-align:center;">
      A private space for the family
    </p>

    <input
      id="email"
      type="email"
      placeholder="Email"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
    >

    <button
      id="loginButton"
      class="brown-btn"
      style="width:100%;"
    >
      Login
    </button>

    <p id="loginMessage"></p>

  </div>

</div>


<!-- =========================
     FAMILY APP
========================= -->

<div id="appPage" class="container app hidden">


  <!-- TOP BAR -->

  <div class="topbar">

    <h1>🌿 Opondo's Family</h1>

    <button
      id="logoutButton"
      class="logout-btn"
    >
      Logout
    </button>

  </div>


  <!-- =========================
       PROFILE
  ========================== -->

  <div class="card">

    <h2>👤 My Profile</h2>

    <div class="profile-center">

      <div id="myProfilePhoto">
        👤
      </div>

      <br>

      <input
        id="profilePhoto"
        type="file"
        accept="image/*"
      >

      <button
        id="profilePhotoButton"
        class="brown-btn"
      >
        📸 Upload Profile Photo
      </button>

      <p id="profileMessage"></p>

    </div>

  </div>


  <!-- =========================
       CREATE POST
  ========================== -->

  <div class="card">

    <h2>🌼 Share With The Family</h2>

    <textarea
      id="postContent"
      placeholder="What's happening in the family?"
    ></textarea>

    <input
      id="postFile"
      type="file"
      accept="image/,video/,.pdf,.doc,.docx"
    >

    <button
      id="postButton"
      class="green-btn"
    >
      Share
    </button>

    <p id="postMessage"></p>

  </div>


  <!-- =========================
       FAMILY FEED
  ========================== -->

  <div class="card">

    <h2>🌿 Family Feed</h2>

    <div id="feed">
      Loading family posts...
    </div>

  </div>

</div>


<!-- =========================
     SUPABASE
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://udbkgjgomhxclgasbfmz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_WOP5H3ij2JBj2s6_9tyxiA_KMoqiwCV";

const BUCKET =
"Family Media";

const client =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;


/* =========================
   LOGIN
========================= */

document
.getElementById("loginButton")
.addEventListener("click", async function() {

  const email =
  document.getElementById("email")
  .value
  .trim();

  const password =
  document.getElementById("password")
  .value;

  const message =
  document.getElementById("loginMessage");

  message.className = "";

  message.innerText =
  "Connecting to Supabase...";


  try {

    const { data, error } =
    await client.auth.signInWithPassword({
      email: email,
      password: password
    });


    if (error) {

      message.className =
      "error";

      message.innerText =
      "❌ " + error.message;

      return;
    }


    currentUser =
    data.user;


    message.className =
    "success";

    message.innerText =
    "✅ Login successful!";


    document
    .getElementById("loginPage")
    .classList
    .add("hidden");


    document
    .getElementById("appPage")
    .classList
    .remove("hidden");


    loadMyProfile();

    loadFeed();


  } catch (error) {

    message.className =
    "error";

    message.innerText =
    "❌ " + error.message;

  }

});


/* =========================
   LOGOUT
========================= */

document
.getElementById("logoutButton")
.addEventListener("click", async function() {

  await client.auth.signOut();

  currentUser = null;


  document
  .getElementById("appPage")
  .classList
  .add("hidden");


  document
  .getElementById("loginPage")
  .classList
  .remove("hidden");

});


/* =========================
   PROFILE PHOTO BUTTON
========================= */

document
.getElementById("profilePhotoButton")
.addEventListener(
  "click",
  uploadProfilePhoto
);


/* =========================
   UPLOAD PROFILE PHOTO
========================= */

async function uploadProfilePhoto() {

  if (!currentUser) {
    return;
  }


  const file =
  document
  .getElementById("profilePhoto")
  .files[0];


  const message =
  document
  .getElementById("profileMessage");


  if (!file) {

    message.className =
    "error";

    message.innerText =
    "Please choose a photo first.";

    return;
  }


  message.className = "";

  message.innerText =
  "Uploading photo...";


  const extension =
  file.name
  .split(".")
  .pop();


  const filePath =
  "profiles/" +
  currentUser.id +
  "/avatar_" +
  Date.now() +
  "." +
  extension;


  const { error: uploadError } =
  await client
  .storage
  .from(BUCKET)
  .upload(
    filePath,
    file
  );


  if (uploadError) {

    message.className =
    "error";

    message.innerText =
    "❌ " +
    uploadError.message;

    return;
  }


  const { error: updateError } =
  await client
  .from("profiles")
  .update({
    avatar_url:
    filePath
  })
  .eq(
    "id",
    currentUser.id
  );


  if (updateError) {

    message.className =
    "error";

    message.innerText =
    "❌ " +
    updateError.message;

    return;
  }


  message.className =
  "success";

  message.innerText =
  "✅ Profile photo updated!";


  document
  .getElementById("profilePhoto")
  .value = "";


  loadMyProfile();

  loadFeed();

}


/* =========================
   LOAD MY PROFILE
========================= */

async function loadMyProfile() {

  if (!currentUser) {
    return;
  }


  const { data: profile } =
  await client
  .from("profiles")
  .select(
    "avatar_url, full_name"
  )
  .eq(
    "id",
    currentUser.id
  )
  .maybeSingle();


  if (!profile) {
    return;
  }


  const photo =
  document
  .getElementById("myProfilePhoto");


  if (
    profile.avatar_url
  ) {

    const { data: signedData } =
    await client
    .storage
    .from(BUCKET)
    .createSignedUrl(
      profile.avatar_url,
      3600
    );


    if (
      signedData &&
      signedData.signedUrl
    ) {

      photo.innerHTML = `

        <img
          src="${signedData.signedUrl}"
          alt="Profile photo"
        >

      `;

    }

  }

}


/* =========================
   CREATE POST
========================= */

document
.getElementById("postButton")
.addEventListener(
  "click",
  createPost
);


async function createPost() {

  if (!currentUser) {
    return;
  }


  const content =
  document
  .getElementById("postContent")
  .value
  .trim();


  const file =
  document
  .getElementById("postFile")
  .files[0];


  const message =
  document
  .getElementById("postMessage");


  if (!content && !file) {

    message.className =
    "error";

    message.innerText =
    "Write something or choose a file.";

    return;
  }


  message.className = "";

  message.innerText =
  "Sharing...";


  let filePath = null;

  let fileType = null;

  let fileName = null;


  /* UPLOAD FILE */

  if (file) {

    fileName =
    file.name;

    fileType =
    file.type;


    const extension =
    file.name
    .split(".")
    .pop();


    filePath =
    "posts/" +
    currentUser.id +
    "/" +
    Date.now() +
    "." +
    extension;


    const { error: uploadError } =
    await client
    .storage
    .from(BUCKET)
    .upload(
      filePath,
      file
    );


    if (uploadError) {

      message.className =
      "error";

      message.innerText =
      "❌ Upload failed: " +
      uploadError.message;

      return;
    }

  }


  /* SAVE POST */

  const { error } =
  await client
  .from("posts")
  .insert({

    user_id:
    currentUser.id,

    content:
    content || null,

    image_url:
    filePath,

    file_type:
    fileType,

    file_name:
    fileName

  });


  if (error) {

    message.className =
    "error";

    message.innerText =
    "❌ " + error.message;

    return;
  }


  document
  .getElementById("postContent")
  .value = "";


  document
  .getElementById("postFile")
  .value = "";


  message.className =
  "success";

  message.innerText =
  "✅ Shared with the family!";


  loadFeed();

}


/* =========================
   LOAD FEED
========================= */

async function loadFeed() {

  const feed =
  document.getElementById("feed");


  feed.innerHTML =
  "Loading posts...";


  const { data: posts, error } =
  await client
  .from("posts")
  .select("*")
  .order(
    "created_at",
    {
      ascending: false
    }
  );


  if (error) {

    feed.innerHTML =
    "<p class='error'>❌ " +
    error.message +
    "</p>";

    return;
  }


  if (
    !posts ||
    posts.length === 0
  ) {

    feed.innerHTML =
    "<p>No family posts yet 🌿</p>";

    return;
  }


  feed.innerHTML = "";


  for (
    const post of posts
  ) {

    const postElement =
    document
    .createElement("div");


    postElement.className =
    "post";


    /* GET PROFILE */

    let name =
    "Family Member";

    let avatarUrl =
    null;


    const { data: profile } =
    await client
    .from("profiles")
    .select(
      "full_name, avatar_url"
    )
    .eq(
      "id",
      post.user_id
    )
    .maybeSingle();


    if (
      profile &&
      profile.full_name
    ) {

      name =
      profile.full_name;

    }


    if (
      profile &&
      profile.avatar_url
    ) {

      const { data: avatarData } =
      await client
      .storage
      .from(BUCKET)
      .createSignedUrl(
        profile.avatar_url,
        3600
      );


      if (
        avatarData &&
        avatarData.signedUrl
      ) {

        avatarUrl =
        avatarData.signedUrl;

      }

    }


    /* AVATAR */

    let avatarHTML =
    `<span>
      ${escapeHTML(
        name.charAt(0)
      )}
    </span>`;


    if (avatarUrl) {

      avatarHTML = `

        <img
          src="${avatarUrl}"
          alt="Profile photo"
        >

      `;

    }


    /* MEDIA */

    let mediaHTML = "";


    if (post.image_url) {

      const { data: signedData } =
      await client
      .storage
      .from(BUCKET)
      .createSignedUrl(
        post.image_url,
        3600
      );


      if (
        signedData &&
        signedData.signedUrl
      ) {


        if (
          post.file_type &&
          post.file_type
          .startsWith("video/")
        ) {

          mediaHTML = `

            <video
              class="post-video"
              controls
            >

              <source
                src="${signedData.signedUrl}"
                type="${post.file_type}"
              >

            </video>

          `;

        }


        else if (
          post.file_type &&
          post.file_type
          .startsWith("image/")
        ) {

          mediaHTML = `

            <img
              class="post-image"
              src="${signedData.signedUrl}"
              alt="Family post"
            >

          `;

        }


        else {

          mediaHTML = `

            <p>

              📄

              <a
                href="${signedData.signedUrl}"
                target="_blank"
              >

                ${escapeHTML(
                  post.file_name ||
                  "Open document"
                )}

              </a>

            </p>

          `;

        }

      }

    }


    /* POST HTML */

    postElement.innerHTML = `

      <div class="post-header">

        <div class="post-avatar">

          ${avatarHTML}

        </div>


        <div class="post-name">

          ${escapeHTML(name)}

        </div>

      </div>


      ${
        post.content
        ?
        `

        <div class="post-content">

          ${escapeHTML(
            post.content
          )}

        </div>

        `
        :
        ""
      }


      ${mediaHTML}


      <div class="actions">

        <button
          onclick="likePost(${post.id})"
        >
          ❤️ Like
        </button>


        ${
          post.user_id ===
          currentUser.id
          ?

          `

          <button
            onclick="deletePost(${post.id})"
          >

            🗑️ Delete

          </button>

          `

          :

          ""
        }

      </div>


      <div class="comment-box">

        <input
          id="comment-${post.id}"
          placeholder="Write a comment..."
        >


        <button
          onclick="addComment(${post.id})"
          class="green-btn"
        >

          Comment

        </button>


        <div
          id="comments-${post.id}"
        ></div>

      </div>

    `;


    feed.appendChild(
      postElement
    );


    loadComments(
      post.id
    );

  }

}


/* =========================
   LIKE
========================= */

async function likePost(
  postId
) {

  const { data: existing } =
  await client
  .from("post_likes")
  .select("id")
  .eq(
    "post_id",
    postId
  )
  .eq(
    "user_id",
    currentUser.id
  )
  .maybeSingle();


  if (existing) {

    await client
    .from("post_likes")
    .delete()
    .eq(
      "id",
      existing.id
    );

  }

  else {

    await client
    .from("post_likes")
    .insert({

      post_id:
      postId,

      user_id:
      currentUser.id

    });

  }

}


/* =========================
   ADD COMMENT
========================= */

async function addComment(
  postId
) {

  const input =
  document.getElementById(
    "comment-" + postId
  );


  const content =
  input.value.trim();


  if (!content) {
    return;
  }


  const { error } =
  await client
  .from("comments")
  .insert({

    post_id:
    postId,

    user_id:
    currentUser.id,

    content:
    content

  });


  if (error) {

    alert(
      error.message
    );

    return;
  }


  input.value = "";


  loadComments(
    postId
  );

}


/* =========================
   LOAD COMMENTS
========================= */

async function loadComments(
  postId
) {

  const container =
  document.getElementById(
    "comments-" + postId
  );


  if (!container) {
    return;
  }


  const { data: comments } =
  await client
  .from("comments")
  .select("*")
  .eq(
    "post_id",
    postId
  )
  .order(
    "created_at",
    {
      ascending: true
    }
  );


  container.innerHTML = "";


  if (!comments) {
    return;
  }


  for (
    const comment of comments
  ) {

    let name =
    "Family Member";


    const { data: profile } =
    await client
    .from("profiles")
    .select(
      "full_name"
    )
    .eq(
      "id",
      comment.user_id
    )
    .maybeSingle();


    if (
      profile &&
      profile.full_name
    ) {

      name =
      profile.full_name;

    }


    const div =
    document.createElement(
      "div"
    );


    div.className =
    "comment";


    div.innerHTML = `

      <strong>
        ${escapeHTML(name)}
      </strong>:

      ${escapeHTML(
        comment.content
      )}

    `;


    container.appendChild(
      div
    );

  }

}


/* =========================
   DELETE POST
========================= */

async function deletePost(
  postId
) {

  if (
    !confirm(
      "Delete this post?"
    )
  ) {

    return;

  }


  const { error } =
  await client
  .from("posts")
  .delete()
  .eq(
    "id",
    postId
  )
  .eq(
    "user_id",
    currentUser.id
  );


  if (error) {

    alert(
      error.message
    );

    return;
  }


  loadFeed();

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(
  text
) {

  const div =
  document.createElement(
    "div"
  );


  div.textContent =
  text || "";


  return div.innerHTML;

}

</script>

</body>
</html>
