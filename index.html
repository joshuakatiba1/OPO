<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#5b3a29">
<title>Opondo's Family</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: #3d3028;
  background-color: #f5efe3;

  /* Polka dots */
  background-image:
    radial-gradient(rgba(91,58,41,.10) 1.5px, transparent 1.5px),
    radial-gradient(rgba(76,111,82,.08) 1.5px, transparent 1.5px);
  background-size: 28px 28px;
  background-position: 0 0, 14px 14px;
}

.hidden {
  display: none !important;
}

header {
  background: linear-gradient(135deg, #5b3a29, #496b4f);
  color: white;
  padding: 18px;
  text-align: center;
  box-shadow: 0 3px 12px rgba(0,0,0,.15);
}

header h1 {
  margin: 0;
  font-size: 25px;
}

header p {
  margin: 5px 0 0;
  opacity: .9;
}

.container {
  max-width: 850px;
  margin: auto;
  padding: 18px;
}

.card {
  background: rgba(255,253,247,.96);
  border-radius: 20px;
  padding: 18px;
  margin-bottom: 18px;
  box-shadow: 0 4px 15px rgba(91,58,41,.12);
  border: 1px solid rgba(91,58,41,.10);
}

button {
  border: none;
  border-radius: 12px;
  padding: 11px 16px;
  background: #5b3a29;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  opacity: .9;
}

.green-btn {
  background: #496b4f;
}

.yellow-btn {
  background: #d6aa42;
  color: #3d3028;
}

.danger {
  background: #a84d42;
}

input,
textarea,
select {
  width: 100%;
  padding: 12px;
  margin: 7px 0;
  border: 1px solid #d6c8b5;
  border-radius: 12px;
  font-size: 15px;
  background: #fffdf7;
}

textarea {
  min-height: 90px;
  resize: vertical;
}

.auth-box {
  max-width: 430px;
  margin: 50px auto;
}

.auth-box h1 {
  text-align: center;
  color: #5b3a29;
}

.auth-buttons {
  display: flex;
  gap: 8px;
}

.auth-buttons button {
  flex: 1;
}

/* Decorative flowers */
.flower {
  position: fixed;
  font-size: 35px;
  opacity: .16;
  pointer-events: none;
}

.flower.one {
  top: 100px;
  left: 10px;
}

.flower.two {
  bottom: 70px;
  right: 10px;
}

.section-title {
  color: #5b3a29;
  margin-top: 0;
}

/* PROFILE */
.profile-row {
  display: flex;
  align-items: center;
  gap: 12px;
}

.profile-photo {
  width: 58px;
  height: 58px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid #5b3a29;
}

.profile-initial {
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background: #496b4f;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: bold;
  border: 3px solid #5b3a29;
}

/* STATUS */
.status-section {
  overflow-x: auto;
}

.status-list {
  display: flex;
  gap: 14px;
  overflow-x: auto;
  padding: 8px 2px 12px;
}

.status-item {
  min-width: 75px;
  text-align: center;
  cursor: pointer;
}

.status-circle {
  width: 66px;
  height: 66px;
  border-radius: 50%;
  padding: 3px;
  background: linear-gradient(135deg, #5b3a29, #496b4f, #d6aa42);
  margin: auto;
}

.status-circle-inner {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  background: #f5efe3;
  display: flex;
  align-items: center;
  justify-content: center;
}

.status-circle img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.status-name {
  font-size: 12px;
  margin-top: 5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.add-status {
  font-size: 30px;
  color: #5b3a29;
}

/* POSTS */
.post {
  border-top: 1px solid #e3d8c8;
  padding-top: 15px;
  margin-top: 15px;
}

.post-header {
  display: flex;
  align-items: center;
  gap: 10px;
}

.post-user {
  font-weight: bold;
  color: #5b3a29;
}

.post-date {
  font-size: 11px;
  color: #88796d;
}

.post-content {
  white-space: pre-wrap;
  margin: 12px 0;
  line-height: 1.5;
}

.post-media {
  max-width: 100%;
  width: 100%;
  max-height: 500px;
  object-fit: contain;
  border-radius: 15px;
  background: #eee5d8;
}

.action-row {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.action-row button {
  background: #eee5d8;
  color: #5b3a29;
  padding: 8px 12px;
}

.action-row button.liked {
  background: #5b3a29;
  color: white;
}

.comment-box {
  display: flex;
  gap: 7px;
  margin-top: 10px;
}

.comment-box input {
  margin: 0;
}

.comment {
  background: #f2eadf;
  border-radius: 12px;
  padding: 8px 11px;
  margin-top: 7px;
  font-size: 14px;
}

.comment strong {
  color: #496b4f;
}

/* STATUS VIEWER */
.status-viewer {
  position: fixed;
  inset: 0;
  background: rgba(30,24,20,.94);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.status-viewer-card {
  max-width: 600px;
  width: 100%;
  max-height: 90vh;
  overflow: auto;
  background: #fffdf7;
  border-radius: 20px;
  padding: 18px;
  position: relative;
}

.status-viewer-media {
  max-width: 100%;
  max-height: 65vh;
  display: block;
  margin: auto;
  border-radius: 15px;
}

.close-status {
  position: absolute;
  right: 12px;
  top: 12px;
  background: #5b3a29;
  border-radius: 50%;
  width: 38px;
  height: 38px;
  padding: 0;
}

/* Mobile */
@media(max-width:600px) {
  .container {
    padding: 10px;
  }

  .card {
    padding: 14px;
    border-radius: 16px;
  }

  header h1 {
    font-size: 21px;
  }

  .action-row {
    flex-wrap: wrap;
  }

  button {
    padding: 10px 13px;
  }
}
</style>
</head>

<body>

<div class="flower one">🌸</div>
<div class="flower two">🌼</div>

<header>
  <h1>🌿 Opondo's Family 🤎</h1>
  <p>Family • Memories • Togetherness</p>
</header>

<!-- LOGIN -->
<div id="authPage" class="container">

  <div class="card auth-box">

    <h1>🌸 Welcome Family</h1>

    <input id="loginEmail" type="email" placeholder="Email">

    <input id="loginPassword" type="password" placeholder="Password">

    <div class="auth-buttons">
      <button onclick="login()">Login</button>
      <button class="green-btn" onclick="showRegister()">Register</button>
    </div>

    <p id="loginMessage"></p>

  </div>

</div>

<!-- REGISTER -->
<div id="registerPage" class="container hidden">

  <div class="card auth-box">

    <h1>🌿 Join the Family</h1>

    <input id="registerName" placeholder="Full name">

    <input id="registerRelationship" placeholder="Relationship e.g. Son, Mum, Cousin">

    <input id="registerEmail" type="email" placeholder="Email">

    <input id="registerPassword" type="password" placeholder="Password">

    <button onclick="register()">Create Account</button>

    <button class="green-btn" onclick="showLogin()" style="margin-top:8px;">
      Back to Login
    </button>

    <p id="registerMessage"></p>

  </div>

</div>

<!-- APP -->
<div id="appPage" class="container hidden">

  <!-- PROFILE -->
  <div class="card">

    <h2 class="section-title">🌸 My Profile</h2>

    <div class="profile-row">

      <div id="myProfilePhoto"></div>

      <div style="flex:1;">
        <strong id="myName"></strong>
        <div id="myRelationship" style="font-size:13px;color:#88796d;"></div>
      </div>

    </div>

    <input
      id="profilePhotoInput"
      type="file"
      accept="image/*"
      onchange="uploadProfilePhoto()"
    >

    <button class="green-btn" onclick="document.getElementById('profilePhotoInput').click()">
      📸 Change Profile Photo
    </button>

    <button class="danger" onclick="logout()" style="float:right;">
      Logout
    </button>

  </div>

  <!-- STATUS -->
  <div class="card status-section">

    <h2 class="section-title">🌸 Family Status</h2>

    <div class="status-list" id="statusList"></div>

  </div>

  <!-- ADD STATUS -->
  <div class="card">

    <h2 class="section-title">✨ Add a Status</h2>

    <textarea
      id="statusText"
      placeholder="What's happening?..."
    ></textarea>

    <input
      id="statusFile"
      type="file"
      accept="image/,video/"
    >

    <button onclick="addStatus()">
      📤 Share Status
    </button>

    <p style="font-size:12px;color:#88796d;">
      Statuses disappear automatically after 24 hours.
    </p>

    <p id="statusMessage"></p>

  </div>

  <!-- CREATE POST -->
  <div class="card">

    <h2 class="section-title">🤎 Share With The Family</h2>

    <textarea
      id="postText"
      placeholder="What's on your mind?"
    ></textarea>

    <input
      id="postFile"
      type="file"
      accept="image/,video/,.pdf,.doc,.docx"
    >

    <button onclick="createPost()">
      📤 Share
    </button>

    <p id="postMessage"></p>

  </div>

  <!-- FEED -->
  <div class="card">

    <h2 class="section-title">🏡 Family Feed</h2>

    <div id="feed">
      Loading family posts...
    </div>

  </div>

</div>

<!-- STATUS VIEWER -->
<div id="statusViewer" class="status-viewer hidden">

  <div class="status-viewer-card">

    <button class="close-status" onclick="closeStatus()">×</button>

    <div id="statusViewerContent"></div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://udbkgjgomhxclgasbfmz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_WOP5H3ij2JBj2s6_9tyxiA_KMoqiwCV";

const BUCKET = "Family Media";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;


/* =========================
   AUTH
========================= */

function showRegister() {
  document.getElementById("authPage").classList.add("hidden");
  document.getElementById("registerPage").classList.remove("hidden");
}

function showLogin() {
  document.getElementById("registerPage").classList.add("hidden");
  document.getElementById("authPage").classList.remove("hidden");
}

async function register() {

  const name =
    document.getElementById("registerName").value.trim();

  const relationship =
    document.getElementById("registerRelationship").value.trim();

  const email =
    document.getElementById("registerEmail").value.trim();

  const password =
    document.getElementById("registerPassword").value;

  const message =
    document.getElementById("registerMessage");

  if (!name || !email || !password) {
    message.textContent =
      "Please fill in your name, email and password.";
    return;
  }

  const { data, error } =
    await supabaseClient.auth.signUp({
      email,
      password,
      options: {
        data: {
          full_name: name,
          relationship: relationship
        }
      }
    });

  if (error) {
    message.textContent = error.message;
    return;
  }

  message.textContent =
    "Account created! Check your email if confirmation is required.";

  setTimeout(showLogin, 1500);
}


async function login() {

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  const message =
    document.getElementById("loginMessage");

  message.textContent = "Logging in...";

  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if (error) {
    message.textContent = error.message;
    return;
  }

  currentUser = data.user;

  openApp();
}


async function logout() {

  await supabaseClient.auth.signOut();

  currentUser = null;

  document.getElementById("appPage")
    .classList.add("hidden");

  document.getElementById("authPage")
    .classList.remove("hidden");
}


/* =========================
   APP
========================= */

async function openApp() {

  document.getElementById("authPage")
    .classList.add("hidden");

  document.getElementById("registerPage")
    .classList.add("hidden");

  document.getElementById("appPage")
    .classList.remove("hidden");

  await loadMyProfile();

  await loadStatuses();

  await loadFeed();
}


/* =========================
   PROFILE
========================= */

async function loadMyProfile() {

  if (!currentUser) return;

  const { data, error } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id", currentUser.id)
      .single();

  if (error) {
    console.log(error);
    return;
  }

  document.getElementById("myName").textContent =
    data.full_name || "Family Member";

  document.getElementById("myRelationship").textContent =
    data.relationship || "";

  displayProfilePhoto(
    "myProfilePhoto",
    data.avatar_url,
    data.full_name
  );
}


function displayProfilePhoto(
  elementId,
  avatarPath,
  name
) {

  const element =
    document.getElementById(elementId);

  if (!avatarPath) {

    const initial =
      (name || "F").charAt(0).toUpperCase();

    element.innerHTML =
      <div class="profile-initial">${initial}</div>;

    return;
  }

  createSignedUrl(avatarPath)
    .then(url => {

      if (!url) return;

      element.innerHTML =
        `<img class="profile-photo"
        src="${url}"
        alt="Profile photo">`;
    });
}


async function uploadProfilePhoto() {

  if (!currentUser) return;

  const input =
    document.getElementById("profilePhotoInput");

  const file = input.files[0];

  if (!file) return;

  const extension =
    file.name.split(".").pop();

  const filePath =
    profiles/${currentUser.id}/avatar_${Date.now()}.${extension};

  const { error: uploadError } =
    await supabaseClient
      .storage
      .from(BUCKET)
      .upload(filePath, file);

  if (uploadError) {

    alert(uploadError.message);
    return;
  }

  const { error: updateError } =
    await supabaseClient
      .from("profiles")
      .update({
        avatar_url: filePath
      })
      .eq("id", currentUser.id);

  if (updateError) {

    alert(updateError.message);
    return;
  }

  await loadMyProfile();

  alert("Profile photo updated!");
}


/* =========================
   STATUS
========================= */

async function addStatus() {

  if (!currentUser) return;

  const text =
    document.getElementById("statusText")
      .value.trim();

  const fileInput =
    document.getElementById("statusFile");

  const file =
    fileInput.files[0];

  const message =
    document.getElementById("statusMessage");

  if (!text && !file) {

    message.textContent =
      "Write something or choose a photo/video.";

    return;
  }

  message.textContent = "Sharing status...";

  let mediaUrl = null;
  let mediaType = null;

  if (file) {

    const extension =
      file.name.split(".").pop();

    const filePath =
      statuses/${currentUser.id}/status_${Date.now()}.${extension};

    const { error } =
      await supabaseClient
        .storage
        .from(BUCKET)
        .upload(filePath, file);

    if (error) {

      message.textContent = error.message;
      return;
    }

    mediaUrl = filePath;

    if (file.type.startsWith("video/")) {
      mediaType = "video";
    } else {
      mediaType = "image";
    }
  }

  const { error } =
    await supabaseClient
      .from("statuses")
      .insert({
        user_id: currentUser.id,
        content: text || null,
        media_url: mediaUrl,
        media_type: mediaType
      });

  if (error) {

    message.textContent = error.message;
    return;
  }

  document.getElementById("statusText").value = "";
  document.getElementById("statusFile").value = "";

  message.textContent =
    "Status shared successfully! 🌸";

  await loadStatuses();
}


async function loadStatuses() {

  const container =
    document.getElementById("statusList");

  container.innerHTML = "";

  const cutoff =
    new Date(Date.now() - 24 * 60 * 60 * 1000)
      .toISOString();

  const { data: statuses, error } =
    await supabaseClient
      .from("statuses")
      .select("*")
      .gte("created_at", cutoff)
      .order("created_at", {
        ascending: false
      });

  if (error) {

    container.innerHTML =
      "Unable to load statuses.";

    console.log(error);
    return;
  }

  const userIds =
    [...new Set(statuses.map(s => s.user_id))];

  let profiles = [];

  if (userIds.length) {

    const result =
      await supabaseClient
        .from("profiles")
        .select("id,full_name,avatar_url")
        .in("id", userIds);

    profiles = result.data || [];
  }

  /* Add Your Status */
  const myProfile =
    profiles.find(p => p.id === currentUser.id);

  let myAvatar = null;

  if (myProfile?.avatar_url) {
    myAvatar =
      await createSignedUrl(myProfile.avatar_url);
  }

  const addItem =
    document.createElement("div");

  addItem.className = "status-item";

  addItem.innerHTML = `
    <div class="status-circle">
      <div class="status-circle-inner">
        ${
          myAvatar
          ? <img src="${myAvatar}">
          : <span class="add-status">+</span>
        }
      </div>
    </div>
    <div class="status-name">Your status</div>
  `;

  addItem.onclick = () => {

    document
      .getElementById("statusText")
      .focus();

  };

  container.appendChild(addItem);


  /* Family statuses */

  const grouped = {};

  statuses.forEach(status => {

    if (!grouped[status.user_id]) {
      grouped[status.user_id] = [];
    }

    grouped[status.user_id].push(status);
  });


  for (const userId of Object.keys(grouped)) {

    const profile =
      profiles.find(p => p.id === userId);

    if (!profile) continue;

    let avatar = null;

    if (profile.avatar_url) {
      avatar =
        await createSignedUrl(profile.avatar_url);
    }

    const item =
      document.createElement("div");

    item.className = "status-item";

    item.innerHTML = `
      <div class="status-circle">
        <div class="status-circle-inner">
          ${
            avatar
            ? <img src="${avatar}">
            : `<span style="font-size:22px;font-weight:bold;">
                ${(profile.full_name || "F").charAt(0)}
              </span>`
          }
        </div>
      </div>

      <div class="status-name">
        ${escapeHtml(profile.full_name || "Family")}
      </div>
    `;

    item.onclick = () => {

      openStatusViewer(
        grouped[userId],
        profile
      );

    };

    container.appendChild(item);
  }
}


/* =========================
   STATUS VIEWER
========================= */

async function openStatusViewer(
  statuses,
  profile
) {

  const viewer =
    document.getElementById("statusViewer");

  const content =
    document.getElementById("statusViewerContent");

  content.innerHTML = "";

  for (const status of statuses) {

    const wrapper =
      document.createElement("div");

    wrapper.style.marginBottom = "25px";

    if (status.media_url) {

      const url =
        await createSignedUrl(status.media_url);

      if (status.media_type === "video") {

        wrapper.innerHTML += `
          <video
            class="status-viewer-media"
            src="${url}"
            controls
            playsinline>
          </video>
        `;

      } else {

        wrapper.innerHTML += `
          <img
            class="status-viewer-media"
            src="${url}">
        `;
      }
    }

    if (status.content) {

      wrapper.innerHTML += `
        <p style="
          text-align:center;
          font-size:18px;
          line-height:1.5;
          color:#5b3a29;
        ">
          ${escapeHtml(status.content)}
        </p>
      `;
    }

    wrapper.innerHTML += `
      <div style="
        text-align:center;
        font-size:12px;
        color:#88796d;
      ">
        ${escapeHtml(profile.full_name || "Family Member")}
        • ${timeAgo(status.created_at)}
      </div>
    `;

    content.appendChild(wrapper);
  }

  viewer.classList.remove("hidden");
}


function closeStatus() {

  document
    .getElementById("statusViewer")
    .classList.add("hidden");

}


/* =========================
   POSTS
========================= */

async function createPost() {

  if (!currentUser) return;

  const text =
    document.getElementById("postText")
      .value.trim();

  const input =
    document.getElementById("postFile");

  const file =
    input.files[0];

  const messag
