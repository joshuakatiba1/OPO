<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Opondo's Family</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4efe4;
      color: #263b2b;
    }

    header {
      background: #244b2f;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 6px 0 0;
    }

    .container {
      max-width: 900px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    input,
    textarea,
    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      background: #2f6b3c;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #245530;
    }

    .secondary {
      background: #777;
    }

    .hidden {
      display: none;
    }

    .post {
      border-top: 1px solid #ddd;
      padding-top: 18px;
      margin-top: 18px;
    }

    .post-header {
      font-weight: bold;
      margin-bottom: 8px;
    }

    .post-date {
      font-size: 12px;
      color: #777;
    }

    .post img,
    .post video {
      width: 100%;
      max-height: 500px;
      object-fit: contain;
      margin-top: 12px;
      border-radius: 10px;
      background: #eee;
    }

    .file-link {
      display: block;
      margin-top: 12px;
      padding: 12px;
      background: #eef4ed;
      border-radius: 8px;
      color: #245530;
      text-decoration: none;
      font-weight: bold;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .actions button {
      width: auto;
      flex: 1;
      margin: 0;
      padding: 9px;
    }

    .comment {
      background: #f5f5f5;
      padding: 10px;
      border-radius: 8px;
      margin-top: 8px;
      font-size: 14px;
    }

    .comment-box {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .comment-box input {
      margin: 0;
      flex: 1;
    }

    .comment-box button {
      width: 90px;
      margin: 0;
    }

    #status {
      margin-top: 10px;
      font-weight: bold;
    }

    .welcome {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .section-title {
      color: #244b2f;
      margin-top: 0;
    }
  </style>
</head>

<body>

<header>
  <h1>Opondo's Family</h1>
  <p>Our private family space ❤️</p>
</header>

<div class="container">

  <!-- LOGIN -->
  <div id="authSection" class="card">

    <h2 class="section-title">Family Login</h2>

    <input
      type="email"
      id="email"
      placeholder="Email address"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <input
      type="text"
      id="fullName"
      placeholder="Full name (for registration)"
    >

    <input
      type="text"
      id="relationship"
      placeholder="Relationship e.g. Son, Daughter, Uncle"
    >

    <button onclick="register()">Create Account</button>

    <button onclick="login()">Login</button>

    <p id="authMessage"></p>

  </div>


  <!-- FAMILY PAGE -->
  <div id="familySection" class="hidden">

    <div class="card">
      <div class="welcome">
        Welcome, <span id="userName"></span> 👋
      </div>

      <button class="secondary" onclick="logout()">Logout</button>
    </div>


    <!-- CREATE POST -->
    <div class="card">

      <h2 class="section-title">📤 Share With The Family</h2>

      <textarea
        id="postContent"
        placeholder="What would you like to share with the family?"
      ></textarea>

      <input
        type="file"
        id="postFile"
        accept="image/,video/,.pdf,.doc,.docx"
      >

      <button onclick="createPost()">Share Post</button>

      <p id="postStatus"></p>

    </div>


    <!-- FAMILY FEED -->
    <div class="card">

      <h2 class="section-title">📰 Family Feed</h2>

      <div id="feed">
        Loading posts...
      </div>

    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://udbkgjgomhxclgasbfmz.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_WOP5H3ij2JBj2s6_9tyxiA_KMoqiwCV";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   REGISTER
========================= */

async function register() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const fullName =
    document.getElementById("fullName").value.trim();

  const relationship =
    document.getElementById("relationship").value.trim();

  const message =
    document.getElementById("authMessage");

  if (!email || !password || !fullName) {

    message.textContent =
      "Please enter your email, password and name.";

    return;
  }

  message.textContent =
    "Creating account...";

  const { data, error } =
    await supabaseClient.auth.signUp({

      email: email,

      password: password,

      options: {
        data: {
          full_name: fullName,
          relationship: relationship
        }
      }

    });


  if (error) {

    message.textContent =
      error.message;

    return;
  }


  message.textContent =
    "Account created! Check your email if confirmation is required.";

}


/* =========================
   LOGIN
========================= */

async function login() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("authMessage");

  message.textContent =
    "Logging in...";


  const { data, error } =
    await supabaseClient.auth.signInWithPassword({

      email: email,

      password: password

    });


  if (error) {

    message.textContent =
      error.message;

    return;
  }


  showFamilyPage(data.user);

}


/* =========================
   LOGOUT
========================= */

async function logout() {

  await supabaseClient.auth.signOut();

  document
    .getElementById("familySection")
    .classList.add("hidden");

  document
    .getElementById("authSection")
    .classList.remove("hidden");

}


/* =========================
   SHOW FAMILY PAGE
========================= */

async function showFamilyPage(user) {

  document
    .getElementById("authSection")
    .classList.add("hidden");

  document
    .getElementById("familySection")
    .classList.remove("hidden");


  let name =
    user.user_metadata?.full_name ||
    "Family Member";


  const { data: profile } =
    await supabaseClient
      .from("profiles")
      .select("full_name")
      .eq("id", user.id)
      .maybeSingle();


  if (profile?.full_name) {

    name =
      profile.full_name;

  }


  document
    .getElementById("userName")
    .textContent = name;


  loadFeed();

}


/* =========================
   CREATE POST
========================= */

async function createPost() {

  const content =
    document
      .getElementById("postContent")
      .value
      .trim();

  const fileInput =
    document
      .getElementById("postFile");

  const file =
    fileInput.files[0];

  const status =
    document
      .getElementById("postStatus");


  const {
    data: { user }
  } =
    await supabaseClient.auth.getUser();


  if (!user) {

    status.textContent =
      "Please log in first.";

    return;
  }


  if (!content && !file) {

    status.textContent =
      "Write something or choose a file.";

    return;
  }


  status.textContent =
    "Sharing with the family...";


  let filePath = null;
  let fileType = null;
  let fileName = null;


  /* =========================
     UPLOAD FILE
  ========================= */

  if (file) {

    fileName =
      file.name;

    fileType =
      file.type;


    const extension =
      file.name.includes(".")
        ? file.name.split(".").pop()
        : "";


    filePath =
      user.id +
      "/" +
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2) +
      (extension ? "." + extension : "");


    const { error: uploadError } =

      await supabaseClient
        .storage
        .from("Family Media")
        .upload(
          filePath,
          file
        );


    if (uploadError) {

      console.error(uploadError);

      status.textContent =
        "Upload failed: " +
        uploadError.message;

      return;
    }

  }


  /* =========================
     SAVE POST
  ========================= */

  const { error } =
    await supabaseClient
      .from("posts")
      .insert({

        user_id:
          user.id,

        content:
          content || null,

        image_url:
          filePath,

        file_type:
          fileType,

        file_name:
          fileName

      });


  if (error) {

    console.error(error);

    status.textContent =
      "Post failed: " +
      error.message;

    return;
  }


  document
    .getElementById("postContent")
    .value = "";

  fileInput.value = "";


  status.textContent =
    "Posted successfully! ❤️";


  loadFeed();

}


/* =========================
   LOAD FAMILY FEED
========================= */

async function loadFeed() {

  const feed =
    document.getElementById("feed");

  feed.innerHTML =
    "Loading posts...";


  const { data: posts, error } =

    await supabaseClient
      .from("posts")
      .select("*")
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    feed.innerHTML =
      "Could not load posts: " +
      error.message;

    return;
  }


  if (!posts || posts.length === 0) {

    feed.innerHTML =
      "<p>No family posts yet. Be the first to share something! ❤️</p>";

    return;
  }


  feed.innerHTML = "";


  for (const post of posts) {

    await displayPost(
      post,
      feed
    );

  }

}


/* =========================
   DISPLAY POST
========================= */

async function displayPost(post, feed) {

  let userName =
    "Family Member";


  const { data: profile } =

    await supabaseClient
      .from("profiles")
      .select("full_name")
      .eq("id", post.user_id)
      .maybeSingle();


  if (profile?.full_name) {

    userName =
      profile.full_name;

  }


  const postElement =
    document.createElement("div");

  postElement.className =
    "post";


  const date =
    new Date(
      post.created_at
    ).toLocaleString();


  let html = `

    <div class="post-header">
      ${escapeHtml(userName)}
    </div>

    <div class="post-date">
      ${date}
    </div>

  `;


  if (post.content) {

    html += `

      <p>
        ${escapeHtml(post.content)}
      </p>

    `;

  }


  /* =========================
     ATTACHED FILE
  ========================= */

  if (post.image_url) {

    const {
      data: signed,
      error: signedError
    } =

      await supabaseClient
        .storage
        .from("Family Media")
        .createSignedUrl(
          post.image_url,
          3600
        );


    if (!signedError && signed?.signedUrl) {

      const url =
        signed.signedUrl;


      if (
        post.file_type &&
        post.file_type.startsWith("image/")
      ) {

        html += `

          <img
            src="${url}"
            alt="Family photo"
          >

        `;

      }

      else if (
        post.file_type &&
        post.file_type.startsWith("video/")
      ) {

        html += `

          <video
            controls
            src="${url}"
          ></video>

        `;

      }

      else {

        html += `

          <a
            class="file-link"
            href="${url}"
            target="_blank"
          >
            📄 ${escapeHtml(
              post.file_name ||
              "Open document"
            )}
          </a>

        `;

      }

    }

  }


  postElement.innerHTML =
    html;


  /* =========================
     ACTIONS
  ========================= */

  const actions =
    document.createElement("div");

  actions.className =
    "actions";


  const likeButton =
    document.createElement("button");

  likeButton.textContent =
    "❤️ Like";


  likeButton.onclick =
    () => likePost(post.id);


  const commentButton =
    document.createElement("button");

  commentButton.textContent =
    "💬 Comment";


  commentButton.onclick =
    () => showCommentBox(
      postElement,
      post.id
    );


  actions.appendChild(
    likeButton
  );

  actions.appendChild(
    commentButton
  );


  postElement.appendChild(
    actions
  );


  /* =========================
     COMMENTS
  ========================= */

  const comments =
    document.createElement("div");


  comments.className =
    "comments";


  const {
    data: commentData
  } =

    await supabaseClient
      .from("comments")
      .select("*")
      .eq(
        "post_id",
        post.id
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (commentData) {

    for (
      const comment
      of commentData
    ) {

      let commentName =
        "Family Member";


      const { data: cp } =

        await supabaseClient
          .from("profiles")
          .select("full_name")
          .eq(
            "id",
            comment.user_id
          )
          .maybeSingle();


      if (cp?.full_name) {

        commentName =
          cp.full_name;

      }


      const commentElement =
        document.createElement("div");


      commentElement.className =
        "comment";


      commentElement.innerHTML = `

        <strong>
          ${escapeHtml(commentName)}
        </strong>

        <br>

        ${escapeHtml(comment.content)}

      `;


      comments.appendChild(
        commentElement
      );

    }

  }


  postElement.appendChild(
    comments
  );


  feed.appendChild(
    postElement
  );

}


/* =========================
   LIKE POST
========================= */

async function likePost(postId) {

  const {
    data: { user }
  } =
    await supabaseClient.auth.getUser();


  if (!user) return;


  const { data: existing } =

    await supabaseClient
      .from("post_likes")
      .select("id")
      .eq(
        "post_id",
        postId
      )
      .eq(
        "user_id",
        user.id
      )
      .maybeSingle();


  if (existing) {

    await supabaseClient
      .from("post_likes")
      .delete()
      .eq(
        "id",
        existing.id
      );

  }

  else {

    await supabaseClient
      .from("post_likes")
      .insert({

        post_id:
          postId,

        user_id:
          user.id

      });

  }

}


/* =========================
   COMMENT BOX
========================= */

function showCommentBox(
  postElement,
  postId
) {

  if (
    postElement.querySelector(
      ".comment-box"
    )
  ) {

    return;

  }


  const box =
    document.createElement("div");


  box.className =
    "comment-box";


  const input =
    document.createElement("input");


  input.placeholder =
    "Write a comment...";


  const button =
    document.createElement("button");


  button.textContent =
    "Send";


  button.onclick =
    async () => {

      const text =
        input.value.trim();


      if (!text) return;


      const {
        data: { user }
      } =
        await supabaseClient
          .auth
          .getUser();


      if (!user) return;


      const { error } =

        await supabaseClient
          .from("comments")
          .insert({

            post_id:
              postId,

            user_id:
              user.id,

            content:
              text

          });


      if (error) {

        alert(
          "Comment failed: " +
          error.message
        );

        return;
      }


      loadFeed();

    };


  box.appendChild(
    input
  );

  box.appendChild(
    button
  );


  postElement.appendChild(
    box
  );

}


/* =========================
   SECURITY / HTML ESCAPE
========================= */

function escapeHtml(text) {

  if (!text) return "";


  return String(text)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================
   CHECK LOGIN ON LOAD
========================= */

async function checkUser() {

  const {
    data: { session }
  } =
    await supabaseClient
      .auth
      .getSession();


  if (session?.user) {

    showFamilyPage(
      session.user
    );

  }

}


checkUser();

</script>

</body>
</html>
