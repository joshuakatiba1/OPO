<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Opondo's Family</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3efe6;
      color: #263b2b;
    }

    header {
      background: #244b2f;
      color: white;
      padding: 22px 15px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 6px 0 0;
      opacity: 0.9;
    }

    .container {
      width: 100%;
      max-width: 800px;
      margin: 25px auto;
      padding: 0 12px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 18px;
      border-radius: 16px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    input,
    textarea,
    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 9px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      background: #2f6b3c;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #245530;
    }

    .secondary {
      background: #777;
    }

    .danger {
      background: #b33a3a;
    }

    .hidden {
      display: none;
    }

    .section-title {
      margin-top: 0;
      color: #244b2f;
    }

    /* POST */

    .post {
      background: white;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 18px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    .post-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #2f6b3c;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
      flex-shrink: 0;
    }

    .post-user {
      font-weight: bold;
      color: #243a2b;
    }

    .post-date {
      font-size: 12px;
      color: #888;
      margin-top: 3px;
    }

    .post-content {
      margin: 15px 0;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .post img,
    .post video {
      width: 100%;
      max-height: 550px;
      object-fit: contain;
      border-radius: 12px;
      background: #eee;
      display: block;
    }

    .file-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px;
      margin-top: 10px;
      border-radius: 10px;
      background: #edf4ed;
      color: #245530;
      text-decoration: none;
      font-weight: bold;
    }

    .post-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #eee;
    }

    .action-btn {
      background: #f4f4f4;
      color: #333;
      margin: 0;
      flex: 1;
      padding: 10px;
    }

    .action-btn.liked {
      background: #e8f3e9;
      color: #216b2f;
    }

    .delete-btn {
      background: #fff0f0;
      color: #b33a3a;
    }

    .comment-section {
      margin-top: 12px;
    }

    .comment {
      background: #f5f5f5;
      padding: 9px 11px;
      border-radius: 9px;
      margin-top: 7px;
      font-size: 14px;
    }

    .comment-name {
      font-weight: bold;
      color: #244b2f;
    }

    .comment-box {
      display: flex;
      gap: 7px;
      margin-top: 10px;
    }

    .comment-box input {
      margin: 0;
      flex: 1;
    }

    .comment-box button {
      width: 75px;
      margin: 0;
    }

    .status {
      font-weight: bold;
      margin-top: 10px;
    }

    .welcome {
      font-size: 18px;
      font-weight: bold;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 25px 10px;
    }
  </style>
</head>

<body>

<header>
  <h1>Opondo's Family</h1>
  <p>Our private family space ❤️</p>
</header>

<div class="container">

  <!-- LOGIN -->
  <div id="authSection" class="card">

    <h2 class="section-title">Family Login</h2>

    <input
      type="email"
      id="email"
      placeholder="Email address"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <input
      type="text"
      id="fullName"
      placeholder="Full name (for registration)"
    >

    <input
      type="text"
      id="relationship"
      placeholder="Relationship e.g. Son, Daughter, Uncle"
    >

    <button onclick="register()">
      Create Account
    </button>

    <button onclick="login()">
      Login
    </button>

    <p id="authMessage"></p>

  </div>


  <!-- FAMILY AREA -->
  <div id="familySection" class="hidden">

    <div class="card">

      <div class="welcome">
        Welcome, <span id="userName"></span> 👋
      </div>

      <button
        class="secondary"
        onclick="logout()"
      >
        Logout
      </button>

    </div>


    <!-- CREATE POST -->
    <div class="card">

      <h2 class="section-title">
        📤 Share With The Family
      </h2>

      <textarea
        id="postContent"
        placeholder="What's happening in the family?"
      ></textarea>

      <input
        type="file"
        id="postFile"
        accept="image/,video/,.pdf,.doc,.docx"
      >

      <button onclick="createPost()">
        Share Post
      </button>

      <p
        id="postStatus"
        class="status"
      ></p>

    </div>


    <!-- FEED -->

    <div>

      <h2 class="section-title">
        📰 Family Feed
      </h2>

      <div id="feed">
        Loading family posts...
      </div>

    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://udbkgjgomhxclgasbfmz.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_WOP5H3ij2JBj2s6_9tyxiA_KMoqiwCV";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   REGISTER
========================= */

async function register() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const fullName =
    document.getElementById("fullName").value.trim();

  const relationship =
    document.getElementById("relationship").value.trim();

  const message =
    document.getElementById("authMessage");


  if (!email || !password || !fullName) {

    message.textContent =
      "Please enter email, password and full name.";

    return;
  }


  message.textContent =
    "Creating account...";


  const { error } =
    await supabaseClient.auth.signUp({

      email,

      password,

      options: {
        data: {
          full_name: fullName,
          relationship
        }
      }

    });


  if (error) {

    message.textContent =
      error.message;

    return;
  }


  message.textContent =
    "Account created! Check your email if confirmation is required.";

}


/* =========================
   LOGIN
========================= */

async function login() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("authMessage");


  message.textContent =
    "Logging in...";


  const { data, error } =
    await supabaseClient.auth.signInWithPassword({

      email,

      password

    });


  if (error) {

    message.textContent =
      error.message;

    return;
  }


  showFamilyPage(
    data.user
  );

}


/* =========================
   LOGOUT
========================= */

async function logout() {

  await supabaseClient.auth.signOut();

  document
    .getElementById("familySection")
    .classList.add("hidden");

  document
    .getElementById("authSection")
    .classList.remove("hidden");

}


/* =========================
   SHOW FAMILY PAGE
========================= */

async function showFamilyPage(user) {

  document
    .getElementById("authSection")
    .classList.add("hidden");

  document
    .getElementById("familySection")
    .classList.remove("hidden");


  let name =
    user.user_metadata?.full_name ||
    "Family Member";


  const { data: profile } =
    await supabaseClient
      .from("profiles")
      .select("full_name")
      .eq("id", user.id)
      .maybeSingle();


  if (profile?.full_name) {

    name =
      profile.full_name;

  }


  document
    .getElementById("userName")
    .textContent =
    name;


  loadFeed();

}


/* =========================
   CREATE POST
========================= */

async function createPost() {

  const content =
    document
      .getElementById("postContent")
      .value
      .trim();

  const fileInput =
    document
      .getElementById("postFile");

  const file =
    fileInput.files[0];

  const status =
    document
      .getElementById("postStatus");


  const {
    data: { user }
  } =
    await supabaseClient.auth.getUser();


  if (!user) {

    status.textContent =
      "Please log in first.";

    return;
  }


  if (!content && !file) {

    status.textContent =
      "Write something or choose a file.";

    return;
  }


  status.textContent =
    "Sharing with the family...";


  let filePath = null;
  let fileType = null;
  let fileName = null;


  /* UPLOAD FILE */

  if (file) {

    fileName =
      file.name;

    fileType =
      file.type;


    const extension =
      file.name.includes(".")
        ? file.name.split(".").pop()
        : "";


    filePath =
      user.id +
      "/" +
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2) +
      (
        extension
          ? "." + extension
          : ""
      );


    const { error: uploadError } =

      await supabaseClient
        .storage
        .from("Family Media")
        .upload(
          filePath,
          file
        );


    if (uploadError) {

      console.error(
        uploadError
      );

      status.textContent =
        "Upload failed: " +
        uploadError.message;

      return;
    }

  }


  /* SAVE POST */

  const { error } =

    await supabaseClient
      .from("posts")
      .insert({

        user_id:
          user.id,

        content:
          content || null,

        image_url:
          filePath,

        file_type:
          fileType,

        file_name:
          fileName

      });


  if (error) {

    console.error(error);

    status.textContent =
      "Post failed: " +
      error.message;

    return;
  }


  document
    .getElementById("postContent")
    .value = "";

  fileInput.value = "";


  status.textContent =
    "Posted successfully! ❤️";


  setTimeout(() => {

    status.textContent = "";

  }, 2500);


  loadFeed();

}


/* =========================
   LOAD FEED
========================= */

async function loadFeed() {

  const feed =
    document.getElementById("feed");


  feed.innerHTML =
    "Loading family posts...";


  const {
    data: posts,
    error
  } =

    await supabaseClient
      .from("posts")
      .select("*")
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    feed.innerHTML =
      "Could not load posts: " +
      error.message;

    return;
  }


  if (!posts?.length) {

    feed.innerHTML = `

      <div class="card empty">

        No family posts yet. ❤️<br>
        Be the first to share something!

      </div>

    `;

    return;
  }


  feed.innerHTML = "";


  for (const post of posts) {

    await displayPost(
      post,
      feed
    );

  }

}


/* =========================
   DISPLAY POST
========================= */

async function displayPost(
  post,
  feed
) {

  const {
    data: { user }
  } =
    await supabaseClient.auth.getUser();


  let userName =
    "Family Member";


  const {
    data: profile
  } =

    await supabaseClient
      .from("profiles")
      .select(
        "full_name, relationship"
      )
      .eq(
        "id",
        post.user_id
      )
      .maybeSingle();


  if (profile?.full_name) {

    userName =
      profile.full_name;

  }


  const initial =
    userName
      .charAt(0)
      .toUpperCase();


  const date =
    new Date(
      post.created_at
    ).toLocaleString();


  const postElement =
    document.createElement("div");


  postElement.className =
    "post";


  /* HEADER */

  const header =
    document.createElement("div");

  header.className =
    "post-header";


  header.innerHTML = `

    <div class="avatar">
      ${escapeHtml(initial)}
    </div>

    <div>

      <div class="post-user">
        ${escapeHtml(userName)}
      </div>

      <div class="post-date">
        ${escapeHtml(date)}
      </div>

    </div>

  `;


  postElement.appendChild(
    header
  );


  /* CONTENT */

  if (post.content) {

    const content =
      document.createElement("div");


    content.className =
      "post-content";


    content.textContent =
      post.content;


    postElement.appendChild(
      content
    );

  }


  /* MEDIA */

  if (post.image_url) {

    const {
      data: signed,
      error: signedError
    } =

      await supabaseClient
        .storage
        .from("Family Media")
        .createSignedUrl(
          post.image_url,
          3600
        );


    if (
      !signedError &&
      signed?.signedUrl
    ) {

      const url =
        signed.signedUrl;


      if (
        post.file_type?.startsWith(
          "image/"
        )
      ) {

        const image =
          document.createElement(
            "img"
          );

        image.src =
          url;

        image.alt =
          "Family photo";


        postElement.appendChild(
          image
        );

      }

      else if (
        post.file_type?.startsWith(
          "video/"
        )
      ) {

        const video =
          document.createElement(
            "video"
          );


        video.controls =
          true;

        video.src =
          url;


        postElement.appendChild(
          video
        );

      }

      else {

        const link =
          document.createElement(
            "a"
          );


        link.href =
          url;

        link.target =
          "_blank";

        link.className =
          "file-link";


        link.innerHTML =
          "📄 " +
          escapeHtml(
            post.file_name ||
            "Open document"
          );


        postElement.appendChild(
          link
        );

      }

    }

  }


  /* =========================
     GET LIKES
  ========================= */

  const {
    data: likes
  } =

    await supabaseClient
      .from("post_likes")
      .select("id,user_id")
      .eq(
        "post_id",
        post.id
      );


  const likeCount =
    likes?.length || 0;


  const userLiked =
    likes?.some(
      like =>
        like.user_id === user?.id
    );


  /* =========================
     GET COMMENTS
  ========================= */

  const {
    data: comments
  } =

    await supabaseClient
      .from("comments")
      .select("*")
      .eq(
        "post_id",
        post.id
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  const commentCount =
    comments?.length || 0;


  /* ACTIONS */

  const actions =
    document.createElement("div");

  actions.className =
    "post-actions";


  const likeButton =
    document.createElement("button");


  likeButton.className =
    "action-btn" +
    (
      userLiked
        ? " liked"
        : ""
    );


  likeButton.textContent =
    ❤️ ${likeCount};


  likeButton.onclick =
    async () => {

      await toggleLike(
        post.id
      );

    };


  const commentButton =
    document.createElement("button");


  commentButton.className =
    "action-btn";


  commentButton.textContent =
    💬 ${commentCount};


  commentButton.onclick =
    () => {

      const box =
        postElement.querySelector(
          ".comment-box"
        );


      if (box) {

        box.scrollIntoView({
          behavior: "smooth"
        });

      }

    };


  actions.appendChild(
    likeButton
  );

  actions.appendChild(
    commentButton
  );


  /* DELETE OWN POST */

  if (
    user &&
    user.id === post.user_id
  ) {

    const deleteButton =
      document.createElement(
        "button"
      );


    deleteButton.className =
      "action-btn delete-btn";


    deleteButton.textContent =
      "🗑️ Delete";


    deleteButton.onclick =
      async () => {

        const confirmed =
          confirm(
            "Delete this post?"
          );


        if (!confirmed) return;


        await deletePost(
          post
        );

      };


    actions.appendChild(
      deleteButton
    );

  }


  postElement.appendChild(
    actions
  );


  /* COMMENTS */

  const commentSection =
    document.createElement(
      "div"
    );


  commentSection.className =
    "comment-section";


  if (comments?.length) {

    for (
      const comment
      of comments
    ) {

      let commentName =
        "Family Member";


      const {
        data: cp
      } =

        await supabaseClient
          .from("profiles")
          .select("full_name")
          .eq(
            "id",
            comment.user_id
          )
          .maybeSingle();


      if (cp?.full_name) {

        commentName =
          cp.full_name;

      }


      const commentElement =
        document.createElement(
          "div"
        );


      commentElement.className =
        "comment";


      commentElement.innerHTML = `

        <span class="comment-name">
          ${escapeHtml(commentName)}
        </span>

        <br>

      `;


      const text =
        document.createTextNode(
          comment.content
        );


      commentElement.appendChild(
        text
      );


      commentSection.appendChild(
        commentElement
      );

    }

  }


  /* COMMENT INPUT */

  const commentBox =
    document.createElement(
      "div"
    );


  commentBox.className =
    "comment-box";


  const input =
    document.createElement(
      "input"
    );


  input.placeholder =
    "Write a comment...";


  const send =
    document.createElement(
      "button"
    );


  send.textContent =
    "Send";


  send.onclick =
    async () => {

      await addComment(
        post.id,
        input.value
      );

    };


  commentBox.appendChild(
    input
  );

  commentBox.appendChild(
    send
  );


  commentSection.appendChild(
    commentBox
  );


  postElement.appendChild(
    commentSection
  );


  feed.appendChild(
    postElement
  );

}


/* =========================
   LIKE / UNLIKE
========================= */

async function toggleLike(
  postId
) {

  const {
    data: { user }
  } =
    await supabaseClient.auth.getUser();


  if (!user) return;


  const {
    data: existing
  } =

    await supabaseClient
      .from("post_likes")
      .select("id")
      .eq(
        "post_id",
        postId
      )
      .eq(
        "user_id",
        user.id
      )
      .maybeSingle();


  if (existing) {

    await supabaseClient
      .from("post_likes")
      .delete()
      .eq(
        "id",
        existing.id
      );

  }

  else {

    await supabaseClient
      .from("post_likes")
      .insert({

        post_id:
          postId,

        user_id:
          user.id

      });

  }


  loadFeed();

}


/* =========================
   ADD COMMENT
========================= */

async function addComment(
  postId,
  text
) {

  text =
    text.trim();


  if (!text) return;


  const {
    data: { user }
  } =
    await supabaseClient.auth.getUser();


  if (!user) return;


  const {
    error
  } =

    await supabaseClient
      .fro
