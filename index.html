<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Opondo's Family</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f0df;
      color: #222;
    }

    header {
      background: #176b32;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
    }

    .container {
      width: 94%;
      max-width: 700px;
      margin: 25px auto;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      margin: 7px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      background: #176b32;
      color: white;
      font-size: 15px;
      cursor: pointer;
      margin-top: 7px;
    }

    button:hover {
      opacity: 0.9;
    }

    .secondary {
      background: #777;
    }

    .danger {
      background: #b3261e;
    }

    .hidden {
      display: none !important;
    }

    .message {
      margin-top: 10px;
      font-weight: bold;
    }

    .post {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 15px;
      margin-top: 15px;
    }

    .post-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #176b32;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
    }

    .post-name {
      font-weight: bold;
    }

    .post-date {
      font-size: 12px;
      color: #777;
    }

    .post-content {
      margin: 15px 0;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .media {
      width: 100%;
      max-height: 500px;
      object-fit: contain;
      border-radius: 10px;
      margin-top: 10px;
      background: #eee;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .actions button {
      background: #eee;
      color: #222;
    }

    .comments {
      margin-top: 15px;
      border-top: 1px solid #ddd;
      padding-top: 10px;
    }

    .comment {
      background: #f5f5f5;
      padding: 9px;
      border-radius: 8px;
      margin-top: 7px;
    }

    .comment-name {
      font-weight: bold;
      font-size: 13px;
    }

    .comment-text {
      font-size: 14px;
      margin-top: 3px;
    }

    .file-name {
      margin-top: 8px;
      font-size: 13px;
      color: #555;
    }

    .logout {
      float: right;
      background: #b3261e;
    }

    .top-space {
      overflow: hidden;
    }

    @media (max-width: 600px) {
      .container {
        width: 96%;
      }

      .card {
        padding: 15px;
      }

      button {
        width: 100%;
      }

      .actions button {
        width: auto;
      }
    }
  </style>
</head>

<body>

<!-- LOGIN PAGE -->

<div id="loginPage">

  <header>
    <h1>Opondo's Family</h1>
    <p>Private Family Network</p>
  </header>

  <div class="container">

    <div class="card">

      <h2>Login</h2>

      <input
        type="email"
        id="loginEmail"
        placeholder="Email"
      >

      <input
        type="password"
        id="loginPassword"
        placeholder="Password"
      >

      <button id="loginButton" type="button">
        Login
      </button>

      <p id="loginMessage" class="message"></p>

      <hr>

      <h3>New family member?</h3>

      <input
        type="text"
        id="registerName"
        placeholder="Full name"
      >

      <input
        type="email"
        id="registerEmail"
        placeholder="Email"
      >

      <input
        type="password"
        id="registerPassword"
        placeholder="Password"
      >

      <input
        type="text"
        id="registerRelationship"
        placeholder="Relationship e.g. Son, Sister, Uncle"
      >

      <button id="registerButton" type="button">
        Create Account
      </button>

      <p id="registerMessage" class="message"></p>

    </div>

  </div>

</div>


<!-- FAMILY PAGE -->

<div id="familyPage" class="hidden">

  <header class="top-space">

    <button
      class="logout"
      id="logoutButton"
      type="button">
      Logout
    </button>

    <h1>Opondo's Family</h1>
    <p>Family Feed</p>

  </header>


  <div class="container">

    <!-- CREATE POST -->

    <div class="card">

      <h2>📤 Share With The Family</h2>

      <textarea
        id="postContent"
        placeholder="What's happening in the family?"
      ></textarea>

      <input
        type="file"
        id="postFile"
        accept="image/,video/,.pdf,.doc,.docx"
      >

      <p id="selectedFile"></p>

      <button
        id="postButton"
        type="button">
        Share
      </button>

      <p id="postMessage" class="message"></p>

    </div>


    <!-- FAMILY FEED -->

    <div class="card">

      <h2>👨‍👩‍👧‍👦 Family Feed</h2>

      <div id="feed">
        Loading family posts...
      </div>

    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
"https://udbkgjgomhxclgasbfmz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_WOP5H3ij2JBj2s6_9tyxiA_KMoqiwCV";

const BUCKET =
"Family Media";


/* CREATE SUPABASE CLIENT */

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* ELEMENTS */

const loginPage =
document.getElementById("loginPage");

const familyPage =
document.getElementById("familyPage");

const loginButton =
document.getElementById("loginButton");

const registerButton =
document.getElementById("registerButton");

const logoutButton =
document.getElementById("logoutButton");

const postButton =
document.getElementById("postButton");

const postFile =
document.getElementById("postFile");


/* LOGIN */

loginButton.addEventListener("click", async function() {

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  const message =
    document.getElementById("loginMessage");

  if (!email || !password) {

    message.style.color = "red";
    message.textContent =
      "Please enter your email and password.";

    return;
  }

  message.style.color = "black";
  message.textContent =
    "Logging in...";

  try {

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {

      message.style.color = "red";
      message.textContent =
        error.message;

      return;
    }

    if (!data.session) {

      message.style.color = "red";
      message.textContent =
        "Login failed. No session was created.";

      return;
    }

    message.style.color = "green";
    message.textContent =
      "Login successful!";

    showFamilyPage();

  } catch (error) {

    console.error(error);

    message.style.color = "red";
    message.textContent =
      "Login error: " + error.message;
  }

});


/* REGISTER */

registerButton.addEventListener("click", async function() {

  const name =
    document.getElementById("registerName").value.trim();

  const email =
    document.getElementById("registerEmail").value.trim();

  const password =
    document.getElementById("registerPassword").value;

  const relationship =
    document.getElementById("registerRelationship").value.trim();

  const message =
    document.getElementById("registerMessage");


  if (!name || !email || !password) {

    message.style.color = "red";

    message.textContent =
      "Please fill in name, email and password.";

    return;
  }


  message.style.color = "black";

  message.textContent =
    "Creating account...";


  try {

    const { data, error } =
      await supabaseClient.auth.signUp({

        email: email,

        password: password,

        options: {
          data: {
            full_name: name,
            relationship: relationship
          }
        }

      });


    if (error) {

      message.style.color = "red";

      message.textContent =
        error.message;

      return;
    }


    message.style.color = "green";

    message.textContent =
      "Account created. Check your email if confirmation is required.";

  } catch (error) {

    console.error(error);

    message.style.color = "red";

    message.textContent =
      "Registration error: " + error.message;

  }

});


/* LOGOUT */

logoutButton.addEventListener("click", async function() {

  await supabaseClient.auth.signOut();

  familyPage.classList.add("hidden");

  loginPage.classList.remove("hidden");

});


/* SHOW FAMILY PAGE */

async function showFamilyPage() {

  loginPage.classList.add("hidden");

  familyPage.classList.remove("hidden");

  await loadFeed();

}


/* FILE NAME */

postFile.addEventListener("change", function() {

  const file = postFile.files[0];

  const selected =
    document.getElementById("selectedFile");

  if (file) {

    selected.textContent =
      "Selected: " + file.name;

  } else {

    selected.textContent = "";

  }

});


/* CREATE POST */

postButton.addEventListener("click", async function() {

  const message =
    document.getElementById("postMessage");

  const content =
    document.getElementById("postContent").value.trim();

  const file =
    postFile.files[0];


  message.style.color = "black";

  message.textContent =
    "Sharing...";


  try {

    const {
      data: {
        user
      }
    } =
      await supabaseClient.auth.getUser();


    if (!user) {

      message.style.color = "red";

      message.textContent =
        "You are not logged in.";

      return;
    }


    let filePath = null;
    let fileType = null;
    let fileName = null;


    /* UPLOAD FILE */

    if (file) {

      fileName = file.name;

      fileType = file.type;


      const extension =
        file.name.split(".").pop();


      filePath =
        user.id +
        "/" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .substring(2) +
        "." +
        extension;


      const {
        error: uploadError
      } =
        await supabaseClient
          .storage
          .from(BUCKET)
          .upload(
            filePath,
            file
          );


      if (uploadError) {

        message.style.color = "red";

        message.textContent =
          "Upload failed: " +
          uploadError.message;

        return;
      }

    }


    /* INSERT POST */

    const {
      error: postError
    } =
      await supabaseClient
        .from("posts")
        .insert({

          user_id: user.id,

          content:
            content || null,

          image_url:
            filePath,

          file_type:
            fileType,

          file_name:
            fileName

        });


    if (postError) {

      message.style.color = "red";

      message.textContent =
        "Post failed: " +
        postError.message;

      return;
    }


    /* CLEAR */

    document.getElementById(
      "postContent"
    ).value = "";

    postFile.value = "";

    document.getElementById(
      "selectedFile"
    ).textContent = "";


    message.style.color = "green";

    message.textContent =
      "Shared with the family!";


    await loadFeed();


  } catch (error) {

    console.error(error);

    message.style.color = "red";

    message.textContent =
      "Error: " + error.message;

  }

});


/* LOAD FEED */

async function loadFeed() {

  const feed =
    document.getElementById("feed");


  feed.innerHTML =
    "Loading posts...";


  try {

    const {
      data: posts,
      error
    } =
      await supabaseClient
        .from("posts")
        .select("*")
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (error) {

      feed.innerHTML =
        "<p>Could not load posts: " +
        escapeHtml(error.message) +
        "</p>";

      return;
    }


    if (!posts || posts.length === 0) {

      feed.innerHTML =
        "<p>No family posts yet. Be the first to share something!</p>";

      return;
    }


    feed.innerHTML = "";


    for (const post of posts) {

      await renderPost(
        post,
        feed
      );

    }


  } catch (error) {

    console.error(error);

    feed.innerHTML =
      "<p>Error loading family feed.</p>";

  }

}


/* RENDER POST */

async function renderPost(
  post,
  feed
) {

  let profile = null;


  /* GET PROFILE */

  const {
    data: profileData
  } =
    await supabaseClient
      .from("profiles")
      .select(
        "full_name"
      )
      .eq(
        "id",
        post.user_id
      )
      .maybeSingle();


  profile =
    profileData;


  const name =
    profile?.full_name ||
    "Family Member";


  const initial =
    name
      .charAt(0)
      .toUpperCase();


  const date =
    new Date(
      post.created_at
    ).toLocaleString();


  const postDiv =
    document.createElement("div");

  postDiv.className =
    "post";


  let mediaHTML = "";


  /* MEDIA */

  if (post.image_url) {

    const {
      data: signedData,
      error: signedError
    } =
      await supabaseClient
        .storage
        .from(BUCKET)
        .createSignedUrl(
          post.image_url,
          3600
        );


    if (!signedError && signedData?.signedUrl) {

      const url =
        signedData.signedUrl;


      if (
        post.file_type &&
        post.file_type.startsWith("image/")
      ) {

        mediaHTML =
          `<img
            class="media"
            src="${url}"
            alt="Family photo"
          >`;

      }

      else if (
        post.file_type &&
        post.file_type.startsWith("video/")
      ) {

        mediaHTML =
          `<video
            class="media"
            controls
          >
            <source
              src="${url}"
              type="${escapeAttribute(post.file_type)}"
            >
            Your browser cannot play this video.
          </video>`;

      }

      else {

        mediaHTML =
          `<p class="file-name">
            📄 ${escapeHtml(post.file_name || "Document")}
          </p>

          <a
            href="${url}"
            target="_blank"
            rel="noopener"
          >
            <button type="button">
              Open Document
            </button>
          </a>`;

      }

    }

  }


  postDiv.innerHTML = `

    <div class="post-header">

      <div class="avatar">
        ${escapeHtml(initial)}
      </div>

      <div>

        <div class="post-name">
          ${escapeHtml(name)}
        </div>

        <div class="post-date">
          ${escapeHtml(date)}
        </div>

      </div>

    </div>


    ${
      post.content
        ?
        `<div class="post-content">
          ${escapeHtml(post.content)}
        </div>`
        :
        ""
    }


    ${mediaHTML}


    <div class="actions">

      <button
        type="button"
        class="likeButton"
      >
        ❤️ Like
      </button>

      <button
        type="button"
        class="commentButton"
      >
        💬 Comment
      </button>

      ${
        post.user_id ===
        (await getCurrentUserId())
        ?
        `<button
          type="button"
          class="deleteButton danger"
        >
          🗑️ Delete
        </button>`
        :
        ""
      }

    </div>


    <div class="comments hidden">

      <div class="commentList">
        Loading comments...
      </div>

      <input
        type="text"
        class="commentInput"
        placeholder="Write a comment..."
      >

      <button
        type="button"
        class="sendComment"
      >
        Send Comment
      </button>

    </div>

  `;


  feed.appendChild(postDiv);


  /* LIKE */

  const likeButton =
    postDiv.querySelector(
      ".likeButton"
    );


  likeButton.addEventListener(
    "click",
    async function() {

      const userId =
        await getCurrentUserId();


      if (!userId) return;


      const {
        data: existing
      } =
        await supabaseClient
          .from("post_likes")
          .select("id")
          .eq(
            "post_id",
            post.id
          )
          .eq(
            "user_id",
            userId
          )
          .maybeSingle();


      if (existing) {

        await supabaseClient
          .from("post_likes")
          .delete()
          .eq(
            "id",
            existing.id
          );

        likeButton.textContent =
          "❤️ Like";

      } else {

        await supabaseClient
          .from("post_likes")
          .insert({

            post_id:
              post.id,

            user_id:
              userId

          });

        likeButton.textContent =
          "💚 Liked";

      }

    }
  );


  /* COMMENTS */

  const commentButton =
    postDiv.querySelector(
      ".commentButton"
    );

  const comments =
    postDiv.querySelector(
      ".comments"
    );


  commentButton.addEventListener(
    "click",
    async function() {

      comments.classList.toggle(
        "hidden"
      );

      if (
        !comments.classList.contains(
          "hidden"
        )
      ) {

        await loadComments(
          post.id,
          postDiv
        );

      }

    }
  );


  /* SEND COMMENT */

  const sendComment =
    postDiv.querySelector(
      ".sendComment"
    );


  sendComment.addEventListener(
    "click",
    async function() {

      const input =
        postDiv.querySelector(
          ".commentInput"
        );


      const text =
        input.value.trim();


      if (!text) return;


      const userId =
        await getCurrentUserId();


      if (!userId) return;


      const {
        error
      } =
        await supabaseClient
          .from("comments")
          .insert({

            post_id:
              post.id,

            user_id:
              userId,

            content:
              text

          });


      if (error) {

        alert(
          "Comment failed: " +
          error.message
        );

        return;
      }


      input.value = "";


      await loadComments(
        post.id,
        postDiv
      );

    }
  );


  /* DELETE */

  const deleteButton =
    postDiv.querySelector(
      ".deleteButton"
    );


  if (deleteButton) {

    deleteButton.addEventListener(
      "click",
      async function() {

        const confirmed =
          confirm(
            "Delete this post?"
          );


        if (!confirmed) return;


        if (post.image_url) {

          await supabaseClient
            .storage
            .from(BUCKET)
            .remove([
              post.image_url
            ]);

        }


        const {
          error
        } =
          await supabaseClient
            .from("posts")
            .delete()
            .eq(
              "id",
              post.id
            );


        if (error) {

          alert(
            "Delete failed: " +
            error.message
          );

          return;
        }


        await loadFeed();

      }
    );

  }

}


/* LOAD COMMENTS */

async function loadComments(
  postId,
  postDiv
) {

  const list =
    postDiv.querySelector(
      ".commentList"
    );


  const {
    data: comments,
    error
  } =
    await supabaseClient
      .from("comments")
      .select("*")
      .eq(
        "post_id",
        postId
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (error) {

    list.textContent =
      "Could not load comments.";

    return;
  }


  if (!comments.length) {

    list.textContent =
      "No comments yet.";

    return;
  }


  list.innerHTML = "";


  for (
    const comment of comments
  ) {

    const {
      data: profile
    } =
      await supabaseClient
        .from("profiles")
        .select(
          "full_name"
        )
        .eq(
          "id",
          comment.user_id
        )
        .maybeSingle();


    const div =
      document.createElement(
        "div"
      );


    div.className =
      "comment";


    div.innerHTML = `

      <div class="comment-name">
        ${escapeHtml(
          profile?.full_name ||
          "Family Member"
        )}
      </div>

      <div class="comment-text">
        ${escapeHtml(
          comment.content
        )}
      </div>

    `;


    list.appendChild(div);

  }

}


/* CURRENT USER */

async function getCurrentUserId() {

  const {
    data
  } =
    await supabaseClient.auth.getUser();


  return data?.user?.id || null;

}


/* ESCAPE HTML */

function escapeHtml(value) {

  if (value === null ||
      value === undefined) {

    return "";

  }


  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeAttribute(value) {

  return escapeHtml(value);

}


/* CHECK EXISTING SESSION */

async function checkSession() {

  try {

    const {
      data
    } =
      await supabaseClient.auth.getSession();


    if (data?.session) {

      showFamilyPage();

    }

  } catch (error) {

    console.error(
      "Session check error:",
      error
    );

  }

}


/* START */

checkSession();

</script>

</body>
</html>
